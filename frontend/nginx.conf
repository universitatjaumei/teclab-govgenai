server {
    # 8080 y no 80: la imagen corre sin privilegios (issue #44) y por debajo del 1024 haría
    # falta root. Este número está también en el `Dockerfile`, el `Caddyfile` y el compose
    # de producción, y los cuatro tienen que decir lo mismo.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Location relativa en las redirecciones. Sin esto nginx compone la URL absoluta con SU
    # propio esquema —`http`, porque el TLS lo termina Caddy— y `https://…/panel` contestaba
    # `Location: http://normativa.uji.es/panel/`. Funciona (Caddy devuelve a https y el HSTS de
    # la aplicación hace que el navegador ni salga), pero es un salto en claro que no hace
    # falta. Medido en producción el 2026-09-02, verificando DOM.5.
    absolute_redirect off;

    # Sonda de salud del propio nginx (distinta del /health del backend).
    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # El backend vive bajo /api/* (ver server/app/main.py). Same-origin: el
    # frontend se compila con VITE_API_URL="" y llama a rutas relativas, así
    # que nginx reenvía tal cual sin reescribir el path.
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El chat SSE (/api/v1/hub/chat/*) necesita streaming sin buffer: si
        # nginx bufferiza la respuesta, el usuario no ve tokens hasta el final.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # El panel, bajo su prefijo (DOM.2). El `dist` se copia a `html/panel`, así que
    # `/panel/assets/x.js` es un fichero real y el fallback del SPA sólo actúa en las
    # rutas de la aplicación. **El `index.html` del fallback es el de dentro**: con el
    # de la raíz, un recurso inexistente devolvería HTML con tipo de contenido de
    # JavaScript, y el error que ve quien depura es «Unexpected token '<'».
    # #248 — `index.html` se revalida siempre: es lo único que dice qué versión toca, y sin
    # cabecera el navegador lo guardaba con su heurística y un recargar normal seguía en la
    # versión anterior al despliegue. Lo de `assets/` lleva el hash del contenido en el nombre:
    # se guarda para siempre, y si no existe es un 404 y no el `index.html` disfrazado de módulo.
    location /panel/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /panel/ {
        add_header Cache-Control "no-cache";
        try_files $uri /panel/index.html;
    }

    # La dirección corta, sin barra final. Quien escriba `.../panel` acaba en el panel
    # y no en un 404.
    location = /panel {
        return 301 /panel/;
    }

    # La raíz de ESTE contenedor. En la VM no se llega aquí —Caddy manda la raíz al
    # sitio del corpus—, pero abierto directo (docker compose local, o depurando la
    # imagen) tiene que llevar a algún sitio en vez de dar 404.
    location = / {
        return 302 /panel/;
    }
}
