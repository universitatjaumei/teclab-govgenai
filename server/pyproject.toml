[project]
name = "automatia-server"
version = "0.1.0"
authors = [{ name = "Modesto Fabra", email = "fabra@uji.es" }]
license = "AGPL-3.0-or-later"
description = "AutomatIA Brain Server - SaaS AI Services"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "automatia-shared",
    # DEP.1 (arreglado el 2026-09-15, tras tumbar produccion) — `uvicorn` es lo que EJECUTA la
    # aplicacion: el `CMD` del Dockerfile es `uvicorn server.app.main:app`. Llegaba de rebote por
    # `browser-use -> mcp -> uvicorn`, y cuando DEP.1 mando `browser-use` al extra
    # `agente-navegador` se fue con el. La imagen instala `uv sync --frozen --no-dev` SIN extras,
    # asi que el contenedor arranco sin uvicorn y murio con
    # `exec: "uvicorn": executable file not found in $PATH`.
    #
    # Es el cuarto caso del mismo defecto que DEP.1 destapo, y el unico que ningun guardarrail de
    # los que habia podia ver: `test_dep1_no_hay_dependencias_de_rebote.py` busca IMPORTS no
    # declarados, y uvicorn no se importa, se invoca. Lo vigila ahora
    # `test_dep8_los_ejecutables_del_dockerfile_estan_declarados.py`.
    "uvicorn>=0.30",
    "fastapi>=0.111.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "sqlmodel>=0.0.14",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv",
    "openai",
    "google-genai",
    "langchain-google-genai>=4.1.3",
    # DEP.7 — el suelo es 1.1.14 por seguridad, no por capricho: PYSEC-2026-76 se corrige ahí,
    # y con `>=1.1.7` la resolución se quedaba en 1.1.9. Lo encontró la PRIMERA ejecución real
    # de la puerta, no la medición local: este paquete cayó en el trozo de 49 que no se pudo
    # auditar en local, y así se dijo. Bajar este suelo vuelve a meter el aviso.
    "langchain-openai>=1.1.14",
    "aiohttp>=3.12.15",
    # DEP.1 — `browser-use` se fue al extra `agente-navegador`. `playwright` se QUEDA aquí, y
    # no es un olvido: `agent_service.py` lo importa en el nivel superior del módulo
    # (`from playwright.async_api import BrowserContext`), mientras que `browser_use` va
    # dentro de un `try/except`. Moverlo exigiría tocar código, que está fuera de este
    # prompt, y no compra nada en seguridad: playwright no tiene ningún aviso en la medición.
    "playwright>=1.40.0",
    # DEP.1 — DECLARADO, y antes llegaba de rebote por `browser-use → mcp`. FastAPI lo exige
    # para `UploadFile` y `Form(`, que la aplicación usa 22 veces en 7 ficheros. No falla al
    # importar: falla al ATENDER la petición, así que sin esta línea el día que cambie el
    # árbol de `browser-use` la subida de un PDF empieza a dar 500 con el arranque en verde.
    # La versión es la corregida: 0.0.21 acumulaba seis avisos.
    "python-multipart>=0.0.31",
    "pgvector>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langfuse>=2.0.0",
    # EXT.3: Docling retirado. Al corpus solo entra `.md` del pipeline de curación (EXT.1) y
    # el contexto se extrae con pdfplumber (EXT.2), así que aquí no quedaba nada que
    # convertir. Se lleva consigo sus modelos de layout y RapidOCR — que era la parte cara
    # del arranque en una máquina sin GPU.
    "langdetect>=1.0.9",
    "langgraph>=1.1.0",
    # DEP.1 — `ragas` y `datasets` se fueron al extra `evaluacion`, y al irse destaparon
    # OTRO caso del mismo defecto que este prompt vino a arreglar: `langchain` estaba en uso
    # y no declarado. Lo necesita `observability.py`, que hace
    # `from langfuse.langchain import CallbackHandler` en el nivel superior del módulo, y
    # llegaba de rebote como transitiva de ragas. Sin esta línea, quitar ragas rompe la
    # importación del router de borradores. La versión es la corregida: 1.2.15 tenía aviso.
    "langchain>=1.3.9",
    # DEP.1 — mismo caso, tercera vez. `bs4` se importa en el NIVEL SUPERIOR de
    # `html_analyzer_service.py` y de `normativa_spider.py`, sin guarda, y llegaba de rebote.
    "beautifulsoup4>=4.12",
    # DEP.1 — sostiene el proveedor **Ollama**: `model_factory.py` hace
    # `from langchain_community.chat_models import ChatOllama` dentro de la rama `ollama`.
    # El import es perezoso pero NO está guardado, así que sin esta línea configurar Ollama
    # revienta en tiempo de ejecución con un `ModuleNotFoundError` que no dice qué instalar.
    # Se declara en vez de mandarlo a un extra porque quitarlo retiraría una capacidad
    # soportada, y la regla del proyecto es que un extra no retira capacidades.
    "langchain-community>=0.3",
    "reportlab>=4.0.0",
    "apscheduler>=3.10.4",
    "fsspec>=2024.6.0",
    "gcsfs>=2024.6.0",
    "s3fs>=2024.6.0",
    "pandas>=2.0.0",
    "camelot-py>=0.11.0",
    # camelot-py pide `chardet>=5.1.0` sin techo y `requests` comprueba el rango al
    # importarse. El techo era `<6` porque `requests` capaba ahi; MEDIDO el 2026-09-22
    # sobre requests 2.34.2, su `check_compatibility` acepta `>= 3.0.2, < 8.0.0`, asi que
    # el motivo de `<6` ya no existe y chardet 7 no avisa de nada.
    #
    # El techo SE QUEDA en `<8`: `requests` no avisa, **asegura**, asi que un chardet 8
    # levantaria un AssertionError al importar `requests`. Sin techo, el proximo
    # `uv lock --upgrade` lo traeria y romperia el arranque entero.
    "chardet>=5.1.0,<8",
    "pdfplumber>=0.11.0",
    # UTL.1 (issue #190) — unir, dividir y optimizar PDF sin que el documento salga. Es PyMuPDF,
    # **AGPL-3.0**: la plataforma ya es AGPL-3.0-or-later, así que no cambia nada de lo que se
    # distribuye. El sandbox ya la tenía para los guiones; ésta es la del servidor.
    "pymupdf>=1.24",
    "spacy>=3.7",
    # **El modelo, y va en las dependencias por defecto a propósito** (issue #170). spaCy sin
    # modelo degrada a regex + anclajes de cabecera **sin decirlo**, así que un despliegue
    # estándar anonimizaría identificadores estructurados y dejaría pasar los nombres que sólo
    # aparecen dentro del texto. Esa es justo la avería que la #170 corrige: una capacidad que se
    # ofrece y no se distingue de estar apagada.
    #
    # No va en un extra —como sí van los modelos locales de `local-models`— porque la
    # anonimización está **activa por omisión** (`politica.MODO_POR_DEFECTO` es `replace`), y un
    # extra que nadie instala deja lo activo funcionando a medias. Medido: 52 MB en disco y ~305
    # MB de RSS tras una pasada real, contra los 216 de `sentence-transformers` más 172 de
    # `torch`; y el RSS sólo se paga si algún texto llega al NER, porque la carga es perezosa.
    #
    # **`md` y no `sm` con número**: sobre 20 nombres de morfología valenciana en prosa
    # administrativa, `sm` recupera el 65 % —deja 7— y `md` el 90 %. `ca_core_news_md` recupera lo
    # mismo que `md` y cuesta 211 MB más; sólo gana en falsos positivos, que en anonimización es
    # lo menos grave (sustituye algo que no era un nombre; no filtra nada).
    #
    # Viene de una URL porque los modelos de spaCy **no se publican en PyPI**. La rueda declara
    # `spacy>=3.8.0,<3.9.0`, así que si algún día `uv lock --upgrade` intentara subir spaCy a 3.9
    # la resolución **falla en alto** en vez de dejar el modelo sin cargar en silencio. Al
    # actualizar spaCy de serie hay que subir esta URL en el mismo commit.
    "es-core-news-md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl",
    "faker>=22.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "python-docx>=1.1.0",
    "odfpy>=1.4.1",
    "python3-saml>=1.16.0",
    # Front-matter del corpus curado (ING.0.3). Estaba disponible como dependencia
    # transitiva; se declara porque la ingesta la importa en producción.
    "PyYAML>=6.0",
    "langchain-google-vertexai>=2.0.0",
]

[project.urls]
Repository = "https://github.com/universitatjaumei/teclab-govgenai"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.27.0",
    "respx>=0.21",
    "ruff",
    "aiosqlite>=0.22.1",
    "pytest-xdist>=3.8.0",
    # PLG.1 — el paquete de ejemplo que aporta un perfil y un pipeline por entry points.
    # Va en `dev` y NO en un extra: sirve para que la suite ejercite el camino de un
    # tercero de verdad —descubrir, cargar, registrar, construir— en vez de simularlo con
    # mocks de `importlib.metadata`. Se midio y instalarlo sale barato; simular habria
    # dejado sin probar justo lo que puede fallar: que un paquete REAL se encuentre.
    # La imagen no lo lleva: el Dockerfile instala con `--no-dev`.
    "govgenai-demo-perfil",
    "pyright>=1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
automatia-shared = { path = "../shared", editable = true }
govgenai-demo-perfil = { path = "tests/fixtures/paquete_perfil_demo", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[project.optional-dependencies]
shared = ["automatia-shared"]
# D.4.0: la pila de modelos locales. Está aquí y no en las dependencias base porque solo la
# usan `LocalEmbeddingService` (BGE-M3) y `LocalReranker`: con embeddings por API y el
# reranker apagado —el despliegue estándar— no se ejecuta nada de esto, pero se pagaba
# entero. Medido en EXT.3: `sentence-transformers` 216 MB, `torch` 172 MB, y entre los tres
# se llevaban casi todo el tiempo de arranque.
#
# NO retira la capacidad: un despliegue edge con modelos locales instala el extra
#     uv sync --extra local-models
# y funciona igual. Sin él, los dos servicios fallan con un mensaje que dice qué instalar.
local-models = [
    "torch",
    "torchvision",
    "sentence-transformers>=3.0.0",
]
# **El techo de `setuptools` ya no está, y la aceptación tampoco (APER.20).** `torch` 2.11
# declaraba `setuptools<82` y eso retenía a `setuptools` en 81.0.0 con un aviso abierto
# (PYSEC-2026-3447), aceptado con fecha en `avisos_aceptados.toml`. La condición de salida
# escrita allí era «cuando torch suba por cualquier otra razón, `setuptools` sube con él»: torch
# 2.13 la cumplió —declara `setuptools>=77.0.3`, sin tope— y de paso corrige su propio aviso.
#
# Así que la aceptación se ha **retirado**, no renovado. Una aceptación caducada se renueva sin
# mirar, y ahí es donde una decisión con fecha se convierte en una exclusión permanente con otro
# nombre. Lo vigila `test_aper20_torch_levanta_el_techo_de_setuptools.py`.
#
# Y un detalle que se midió y contradecía lo que parecía obvio: **`setuptools` sí llega al
# despliegue estándar**, por `spacy` y `thinc`, no sólo por `torch`. Por eso la subida movía algo
# fuera del extra, y fue el único cambio en el conjunto desplegado.
# **El extra `evaluacion` estuvo aquí y se retiró el 2026-09-24, con `ragas` y `datasets`
# dentro.** DEP.1 lo había creado para sacarlos del conjunto por defecto; ahora no están en
# ninguno.
#
# **La razón no fueron los avisos, aunque se los llevó todos.** `ragas` traía los dos únicos
# avisos sin versión corregida publicada del repositorio —el suyo y el de `diskcache`, que
# entraba detrás—, y su proveedor no había respondido a la comunicación del fallo, así que la
# corrección no iba a llegar. Pero eso sólo hacía la decisión más fácil: lo que la justificó es
# que **sus dos funciones no tenían ningún llamador fuera de los tests**, y esos tests simulaban
# la llamada a RAGAS. Era una capacidad que figuraba en el manifiesto y no se ejecutaba en
# ninguna parte.
#
# **Lo que sí mide la calidad del RAG se queda, y no usa RAGAS**: `retrieval_metrics.py`
# (recall@k y MRR, funciones puras), el dataset dorado con su línea base y su gate de CI, y las
# tres comprobaciones de cita de `escenario_metricas.py`. Lo que no hay —medición automática de
# la calidad de la *respuesta*— tampoco lo había con RAGAS instalado, y su sitio es la issue del
# backlog sobre revisión humana de respuestas.
#
# Lo que impide que vuelva sin decidirlo es `tests/infra/test_dep2_ragas_se_retiro.py`.
#
# **`agente-navegador` estuvo aquí y se retiró en APER.19.** Lo pedía un solo fichero,
# `services/agent_service.py`, y a ése no lo llamaba nadie en producción: era el hallazgo M7
# de la auditoría del 2026-08-10, «tres servicios sin llamantes». Su `browser-use` traía
# `authlib`, `httplib2` y `mcp` — tres de los seis avisos abiertos el 2026-09-19, uno crítico.
# Se fueron sin actualizar nada, dejando de depender. Si algún día hace falta un agente de
# navegador, el código está en el historial de git y la decisión será otra.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# TST.4: `addopts` mínimo, a propósito.
#
# La cobertura estaba forzada en TODA ejecución local y cuesta ~40 % (medido: 21,3 s → 12,8 s
# sobre `tests/public_graphs`). Quien la mide de verdad es CI, que ya pasa `--cov=app
# --cov-report=xml --cov-report=term-missing` explícito en sus dos invocaciones, así que
# quitarla de aquí no baja la cobertura vigilada ni un punto. En local, bajo demanda:
#
#     uv run pytest tests --cov=app --cov-report=term-missing
#
# `-n auto` reparte los tests entre los núcleos disponibles. Es seguro porque cada test que
# toca BD crea la suya con nombre único (fixture `db_url`), así que no hay estado compartido
# que serializar. Para depurar un fallo con la salida en orden: `-p no:randomly -n0`.
addopts = [
    "-n", "auto",
]
markers = [
    # INF.7 — los tests que prueban la guarda de modulos se quedan con la funcion de verdad;
    # el resto la tiene parcheada por el fixture autouse de `tests/conftest.py`.
    "sin_guarda_de_modulos: usa la comprobacion real de modulos concedidos",
]

# PLG.1 — el servidor pasa a ser INSTALABLE, y sólo para que exista su distribución.
#
# Hasta aquí `automatia-server` era un proyecto «virtual»: uv instalaba sus dependencias pero
# nunca el proyecto, así que **no había distribución** y `importlib.metadata.entry_points()` no
# podía ver nada declarado aquí. Los perfiles, pipelines y estrategias del núcleo tienen que
# entrar por el mismo camino que los de un tercero (regla «un solo camino de registro»), y ese
# camino son los entry points. Sin `[build-system]` no hay entry points que descubrir.
#
# **El wheel va VACÍO a propósito, y `bypass-selection` lo dice en voz alta.** El código NO viaja
# en él, y hay dos razones:
#
#  1. **El nombre de import no coincide con este directorio.** El paquete es `server.app`, o sea
#     que su raíz es la RAÍZ DEL REPOSITORIO, un nivel por encima de este `pyproject.toml`.
#     Empaquetar `app/` produciría un top-level `app` en site-packages que nadie importa —el
#     código dice `from server.app...`— y que podría ensombrecer a otro paquete con ese nombre,
#     que es de los más genéricos que hay.
#  2. **El `Dockerfile` copia sólo los manifiestos antes de `uv sync`**, para que un cambio de
#     código no invalide la capa de dependencias. Un wheel con código obligaría a copiar
#     `server/app/` antes de instalar y se perdería esa caché en cada commit.
#
# Cómo llega el código entonces: en desarrollo, la raíz del repositorio está en `sys.path`; en la
# imagen, el `Dockerfile` hace `COPY server/app/` y fija `PYTHONPATH=/app`. Ninguno de los dos
# depende del wheel. Medido el 2026-09-16 reproduciendo el orden del `Dockerfile`: instala, deja
# `automatia_server-0.1.0.dist-info` —que es lo único que se busca— y **cero ficheros**.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# El modelo de spaCy viene de una URL (los modelos no se publican en PyPI), y hatchling rechaza
# una referencia directa mientras no se diga que se admite. Sin esto `uv sync` ni siquiera
# construye el paquete del servidor: «Dependency #38 cannot be a direct reference».
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true

# PLG.1 — los perfiles y pipelines del NÚCLEO, declarados igual que los de un tercero.
#
# Esto es la regla «un solo camino de registro» hecha fichero. Antes `graph_factory.py` los
# registraba por código al importarse; ahora entran por donde entrarían los de un paquete
# instalado, y el núcleo pasa a ser el primer usuario de su propia API pública. Si algo le falta
# a esa API, sale a la primera y no cuando llegue el primer tercero.
#
# Los nombres de la izquierda son los que ve el usuario en el panel y los que se guardan en
# `hub_chatbots.public_graph_profile`. Cambiar uno es cambiar un dato ya escrito en la base: no
# se renombran sin migración.
[project.entry-points."govgenai.graph_profiles"]
PUBLIC_KB_RICH = "server.app.modules.agents_hub.agent.public_graphs.core.graph_factory:_make_public_kb_rich"
PUBLIC_PORTAL_AGGREGATOR = "server.app.modules.agents_hub.agent.public_graphs.core.graph_factory:_make_public_portal_aggregator"
PUBLIC_PORTAL_ROUTER = "server.app.modules.agents_hub.agent.public_graphs.core.graph_factory:_make_public_portal_router"

[project.entry-points."govgenai.retrieval_pipelines"]
RAG = "server.app.modules.agents_hub.agent.public_graphs.strategies.rag_vector_pipeline:RagVectorPipeline"
MD_LONG_CONTEXT = "server.app.modules.agents_hub.agent.public_graphs.strategies.md_long_context_pipeline:MdLongContextPipeline"
MD_AGENT_SELECTOR = "server.app.modules.agents_hub.agent.public_graphs.strategies.md_agent_selector_pipeline:MdAgentSelectorPipeline"

# PLG.2 — las estrategias del núcleo, por eje. El nombre es `<eje>.<nombre>`; el eje tiene que
# ser uno de los cuatro de `EjeDeEstrategia` (estructura), y el nombre es libre (vocabulario).
#
# `language.default` es la que respeta `language_mode` de LANG. Las otras dos del eje están para
# poder fijar una política **por chatbot** sin tocar `language_mode`, que es de organización.
[project.entry-points."govgenai.strategies"]
"retrieval.single_source" = "server.app.modules.agents_hub.agent.public_graphs.strategies.nucleo:single_source_retrieval"
"merge.passthrough" = "server.app.modules.agents_hub.agent.public_graphs.strategies.nucleo:passthrough_merge"
"template.generic" = "server.app.modules.agents_hub.agent.public_graphs.strategies.nucleo:generic_template"
"language.default" = "server.app.modules.agents_hub.agent.public_graphs.strategies.nucleo:default_language"
"language.neutral" = "server.app.modules.agents_hub.agent.public_graphs.strategies.nucleo:neutral_language"
"language.strict" = "server.app.modules.agents_hub.agent.public_graphs.strategies.nucleo:strict_language"

# ---------------------------------------------------------------------------
# Comprobación de tipos (issue #49). **Por módulo, y el alcance está aquí escrito.**
#
# Encenderlo sobre el árbol entero daría cientos de avisos y acabaría desactivado, que es como
# mueren estas herramientas. Se empieza por `app/core/`, que es lo compartido y lo que más se
# importa, y se amplía módulo a módulo con su commit.
#
# **Por qué aquí importa más que en otro proyecto.** La frontera edge/cloud se expresa con
# protocolos —`ConfigProvider`, `EmbeddingService`—, y un protocolo que nadie comprueba es una
# promesa de firma que sólo se verifica ejecutando el camino: una implementación que no la cumple
# del todo falla en el despliegue donde ese camino sí se recorre. Hay precedente: la regla de leer
# el contenido del modelo con `texto_de` nació de un defecto de tipos —Gemini devuelve `content`
# como lista de bloques cuando hay más de una parte— que un comprobador habría señalado en el
# fichero donde estaba, y no más tarde y en otro sitio.
#
# `extraPaths` con la raíz del repositorio porque el código se importa como `server.app.…` y este
# manifiesto vive dentro de `server/`: sin esa línea, pyright no resuelve **ni uno** de sus
# propios imports y devuelve 51 errores que no son errores.
#
# **SIGUIENTE MÓDULO: `app/routers/`.** Elegido midiendo y no a ojo — el 2026-09-20, con esta
# misma configuración: `routers` 8 errores en 34 ficheros, `api` 6 en 7, `database` 5 en 4,
# `modules/automation` 14 en 5, `services` 17 en 8. `routers` sale de los más baratos **y** es
# donde vive el contrato con el frontend, que es donde un tipo equivocado se paga dos veces.
# Después, por coste: `api`, `database`, `modules/automation`, `services`.
#
# Ampliar es añadir el directorio a `include`, dejarlo en cero y commitearlo aparte. Que el
# siguiente esté escrito aquí es lo que hace que no dependa de que alguien se acuerde; lo vigila
# `tests/infra/test_issue49_los_tipos_se_comprueban_por_modulo.py`.
[tool.pyright]
include = ["app/core"]
extraPaths = [".."]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"

# ---------------------------------------------------------------------------
# El conjunto de reglas de `ruff`, **declarado y no heredado**.
#
# Hasta el 2026-09-20 no había ninguna sección `[tool.ruff]` en todo el repositorio: el proyecto
# vivía del conjunto **por omisión** de la herramienta. Y el día que `ruff` pasó de 0.14 a 0.16
# ese conjunto creció: `ruff check app tests` pasó de **0 a 2.312 errores** sin que cambiara una
# línea de código. No es que el código empeorara; es que el linter se convirtió en otra
# herramienta sin que nadie lo decidiera.
#
# Estas cuatro familias son exactamente las que 0.14 aplicaba por omisión, así que declararlas
# **no cambia lo que se exige hoy**: lo hace explícito, y evita que la próxima subida vuelva a
# redefinir en silencio qué significa «la suite está limpia».
#
# **Ampliar es una decisión, y aquí está la medida para tomarla**: con el conjunto ampliado de
# 0.16 salen 2.312 avisos, de los que **1.526 los arregla la herramienta**. Los tres grupos más
# grandes son `I001` (imports sin ordenar, 856), `B008` (llamada en argumento por defecto, 484)
