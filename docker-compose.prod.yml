# docker-compose.prod.yml — Fase 11 "One-Click": levanta TODO el stack con
# `docker compose -f docker-compose.prod.yml up -d` (más `--profile ollama` si
# se quiere LLM local en vez de un proveedor cloud). Ver Prompt 11.3 para el
# script de arranque asistido (setup.sh) que envuelve este fichero.
#
# | Componente   | Opción cloud (GCP/Azure) | Opción autoinstalable (local) |
# |--------------|--------------------------|--------------------------------|
# | Cerebro (LLM)| Vertex AI / OpenAI/OpenRouter | Ollama (`--profile ollama`) |
# | Archivos     | GCS / S3                 | MinIO (este compose)          |
# | Identidad    | SSO SAML institucional   | login email+contraseña (por defecto) |
# | Despliegue   | Cloud Run / Terraform    | Docker Compose (este fichero) |

# Nombre de proyecto explícito y distinto de docker-compose.yml (dev): evita
# que Compose confunda ambos ficheros como el mismo proyecto y recree/elimine
# contenedores del otro entorno al levantar cualquiera de los dos.
name: govgenai-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govgenai_app
    env_file:
      - server/.env
    environment:
      # SEC.9.6 — sin `:-` en ningún secreto. Los servicios `postgres` y `minio` ya exigían la
      # variable; aquí había un valor por omisión publicado en el repositorio, así que un `.env`
      # incompleto no fallaba: levantaba producción con `govgenai_dev` / `minioadmin_dev`. Que
      # el fallo fuera «ruidoso» —la app no conectaría— sólo vale mientras no haya una base
      # sembrada en desarrollo con esa misma contraseña, y entonces arranca del todo.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?falta POSTGRES_USER}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?falta POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:?falta POSTGRES_USER}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?falta POSTGRES_DB}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SANDBOX_BASE_URL: http://script-sandbox:5000
    # #269 — en `127.0.0.1`: se administra desde la propia máquina y no queda abierto a la
    # red. Sólo el panel se publica hacia fuera, que es quien termina las peticiones.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      script-sandbox:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - sandbox-net
    # Techos como en la VM (#269): sin ellos un servicio desbocado se lleva la máquina.
    deploy:
      resources:
        limits:
          memory: 2048M
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin: nginx reenvía /api/* a "app" (ver frontend/nginx.conf).
        # No hace falta conocer un host público en tiempo de build.
        VITE_API_URL: ""
    container_name: govgenai_frontend
    ports:
      # 80 fuera, 8080 dentro: el contenedor corre sin privilegios (issue #44).
      - "80:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # 8080, como el `listen` de nginx y el mapeo de arriba. Esta sonda es **del compose** y
      # sobreescribe la del `Dockerfile`, así que se le escapó al cambio de la issue #44:
      # llamaba al 80, donde nginx ya no escucha, y el servicio habría quedado `unhealthy`
      # para siempre con el panel funcionando. Lo encontró la revisión de la PR #73.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  ollama:
    # Fijada (issue #43): con `:latest` no se puede saber qué versión corre ni volver a la
    # anterior, que son las dos preguntas de cualquier incidente. Dependabot vigila `docker`,
    # así que subirla será una PR y no una sorpresa.
    image: ollama/ollama:0.34.2
    container_name: govgenai_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Sin techo de memoria a propósito: la que necesita es la del modelo que se elija.
    restart: unless-stopped
    profiles:
      - ollama

  script-sandbox:
    build:
      context: ./services/script_sandbox
      dockerfile: Dockerfile
    container_name: govgenai_script_sandbox
    environment:
      SANDBOX_TMP_DIR: /tmp/sandbox
    networks:
      - sandbox-net
    read_only: true
    tmpfs:
      - /tmp/sandbox:size=128M,mode=0700,uid=65534,gid=65534
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    # SEC.8.3: los límites de CPU y memoria no acotan el número de procesos, así que una
    # fork-bomb agota los PID del host sin salirse de su presupuesto de memoria.
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 128
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govgenai_migrate
    environment:
      # SEC.9.6 — mismo criterio que en `app`: si falta la variable, el compose se detiene en vez
      # de aplicar migraciones contra una base con credenciales del repositorio.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?falta POSTGRES_USER}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?falta POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:?falta POSTGRES_USER}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?falta POSTGRES_DB}
    working_dir: /app/server
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: on-failure

  langfuse:
    image: langfuse/langfuse:3.225.11
    container_name: govgenai_langfuse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # #269 — `:?` en cada secreto: sin él Langfuse arrancaba con los suyos vacíos.
      DATABASE_URL: postgresql://${POSTGRES_USER:?falta POSTGRES_USER}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?falta LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT:?falta LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?falta LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: govgenai-org
      LANGFUSE_INIT_ORG_NAME: "Gov Gen AI"
      LANGFUSE_INIT_PROJECT_ID: govgenai-project
      LANGFUSE_INIT_PROJECT_NAME: govgenai
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?falta LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?falta LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:?falta LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:?falta LANGFUSE_ADMIN_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: govgenai_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  minio:
    # **Fijada, y en quay.io (issue #43).** Dos cosas a la vez. Con `:latest` no se puede
    # saber qué versión corre ni volver a la anterior. Y además `minio/minio` **ya no se puede
    # tirar de Docker Hub sin credenciales**: medido el 2026-09-19, el registro responde 401 a
    # un token anónimo y la API del Hub responde 404 al repositorio, mientras `ollama/ollama`
    # responde 200 por las dos vías. MinIO publica en quay.io, y la imagen de allí es el
    # **mismo build** (mismo `commit-id`) que la que había en la caché local.
    #
    # O sea que esto no era sólo poco reproducible: no arrancaba para quien lo copiara. Cuidado
    # al comprobarlo, que aquí casi cuela: `docker run minio/minio:latest` funciona si la
    # máquina tiene una copia vieja en caché, y eso no dice nada del registro.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: govgenai_minio_prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_prod:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

networks:
  sandbox-net:
    driver: bridge
    internal: true   # PROD: sin egress a internet, solo intercomunicación entre containers conectados

# Nombres pinchados: ver la nota equivalente en docker-compose.yml. En producción
# esto además evita que mover o renombrar el directorio de instalación desconecte
# la base de datos del cliente.
volumes:
  postgres_data_prod:
    name: govgenai-prod_postgres_data_prod
  minio_data_prod:
    name: govgenai-prod_minio_data_prod
  ollama_data:
    name: govgenai-prod_ollama_data
