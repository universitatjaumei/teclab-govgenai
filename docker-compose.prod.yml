# docker-compose.prod.yml — Fase 11 "One-Click": levanta TODO el stack con
# `docker compose -f docker-compose.prod.yml up -d` (más `--profile ollama` si
# se quiere LLM local en vez de un proveedor cloud, y `--profile observabilidad`
# para Langfuse). Ver Prompt 11.3 para el script de arranque asistido (setup.sh)
# que envuelve este fichero.
#
# | Componente   | Opción cloud (GCP/Azure) | Opción autoinstalable (local) |
# |--------------|--------------------------|--------------------------------|
# | Cerebro (LLM)| Vertex AI / OpenAI/OpenRouter | Ollama (`--profile ollama`) |
# | Archivos     | GCS / S3                 | SeaweedFS, S3 (este compose)  |
# | Identidad    | SSO SAML institucional   | login email+contraseña (por defecto) |
# | Despliegue   | Cloud Run / Terraform    | Docker Compose (este fichero) |

# Nombre de proyecto explícito y distinto de docker-compose.yml (dev): evita
# que Compose confunda ambos ficheros como el mismo proyecto y recree/elimine
# contenedores del otro entorno al levantar cualquiera de los dos.
name: govgenai-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govgenai_app
    env_file:
      - server/.env
    environment:
      # SEC.9.6 — sin `:-` en ningún secreto. Los servicios `postgres` y del almacén ya exigían la
      # variable; aquí había un valor por omisión publicado en el repositorio, así que un `.env`
      # incompleto no fallaba: levantaba producción con `govgenai_dev` / `minioadmin_dev`. Que
      # el fallo fuera «ruidoso» —la app no conectaría— sólo vale mientras no haya una base
      # sembrada en desarrollo con esa misma contraseña, y entonces arranca del todo.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?falta POSTGRES_USER}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?falta POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:?falta POSTGRES_USER}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?falta POSTGRES_DB}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SANDBOX_BASE_URL: http://script-sandbox:5000
    # #269 — en `127.0.0.1`: se administra desde la propia máquina y no queda abierto a la
    # red. Sólo el panel se publica hacia fuera, que es quien termina las peticiones.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      script-sandbox:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - sandbox-net
    # Techos como en la VM (#269): sin ellos un servicio desbocado se lleva la máquina.
    deploy:
      resources:
        limits:
          memory: 2048M
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin: nginx reenvía /api/* a "app" (ver frontend/nginx.conf).
        # No hace falta conocer un host público en tiempo de build.
        VITE_API_URL: ""
    container_name: govgenai_frontend
    ports:
      # 80 fuera, 8080 dentro: el contenedor corre sin privilegios (issue #44).
      - "80:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # 8080, como el `listen` de nginx y el mapeo de arriba. Esta sonda es **del compose** y
      # sobreescribe la del `Dockerfile`, así que se le escapó al cambio de la issue #44:
      # llamaba al 80, donde nginx ya no escucha, y el servicio habría quedado `unhealthy`
      # para siempre con el panel funcionando. Lo encontró la revisión de la PR #73.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  ollama:
    # Fijada (issue #43): con `:latest` no se puede saber qué versión corre ni volver a la
    # anterior, que son las dos preguntas de cualquier incidente. Dependabot vigila `docker`,
    # así que subirla será una PR y no una sorpresa.
    image: ollama/ollama:0.34.2
    container_name: govgenai_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Sin techo de memoria a propósito: la que necesita es la del modelo que se elija.
    restart: unless-stopped
    profiles:
      - ollama

  script-sandbox:
    build:
      context: ./services/script_sandbox
      dockerfile: Dockerfile
    container_name: govgenai_script_sandbox
    environment:
      SANDBOX_TMP_DIR: /tmp/sandbox
    networks:
      - sandbox-net
    read_only: true
    tmpfs:
      - /tmp/sandbox:size=128M,mode=0700,uid=65534,gid=65534
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    # SEC.8.3: los límites de CPU y memoria no acotan el número de procesos, así que una
    # fork-bomb agota los PID del host sin salirse de su presupuesto de memoria.
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 128
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govgenai_migrate
    environment:
      # SEC.9.6 — mismo criterio que en `app`: si falta la variable, el compose se detiene en vez
      # de aplicar migraciones contra una base con credenciales del repositorio.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?falta POSTGRES_USER}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?falta POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:?falta POSTGRES_USER}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?falta POSTGRES_DB}
    working_dir: /app/server
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: on-failure

  # ── Observabilidad (`--profile observabilidad`) ─────────────────────────────────
  #
  # #297 — Langfuse 3 necesita además ClickHouse, Redis y un almacenamiento de objetos, y aquí
  # sólo tenía Postgres: en una instalación autoinstalable no arrancaba, sin que nada más lo
  # notara porque la aplicación no depende de él. Va en un perfil, como Ollama, porque son
  # tres servicios y un par de gigas de memoria que no todo el mundo quiere; quien lo levanta,
  # lo levanta entero. Sus buckets los crea el almacén `s3` de este mismo compose al arrancar.
  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: govgenai_clickhouse
    # Revisión de la PR #313 — la contraseña va sin `:?` (ni `:-`, NUEVO-9): Compose interpola todo,
    # perfiles inactivos incluidos, y un `.env` anterior a #297 tumbaba el `up` de todos los
    # servicios, la aplicación también. Se exige aquí, al levantar el perfil, y no antes.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        test -n "$${CLICKHOUSE_PASSWORD}" ||
        { echo "falta CLICKHOUSE_PASSWORD en .env: ver docs/INSTALACION.md" >&2; exit 1; };
        exec /entrypoint.sh
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data_prod:/var/lib/clickhouse
      - ./scripts/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
    restart: unless-stopped
    profiles:
      - observabilidad

  redis:
    image: redis:7.4.10-alpine
    container_name: govgenai_redis
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    profiles:
      - observabilidad

  langfuse:
    image: langfuse/langfuse:4.70.0
    container_name: govgenai_langfuse
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    # #318 — sus siete secretos van sin `:?`, como `CLICKHOUSE_PASSWORD`: Compose interpola también
    # los perfiles inactivos, y con `:?` un `.env` sin ellos impedía levantar la aplicación a quien
    # no quiere observabilidad. Se exigen aquí, al arrancar. El `entrypoint` borra también el
    # `command` de la imagen, así que al final se cede a su arranque original.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        test -n "$${NEXTAUTH_SECRET}" ||
        { echo "falta LANGFUSE_NEXTAUTH_SECRET en .env: ver docs/INSTALACION.md" >&2; exit 1; };
        test -n "$${SALT}" ||
        { echo "falta LANGFUSE_SALT en .env: ver docs/INSTALACION.md" >&2; exit 1; };
        test -n "$${ENCRYPTION_KEY}" ||
        { echo "falta LANGFUSE_ENCRYPTION_KEY en .env: ver docs/INSTALACION.md" >&2; exit 1; };
        test -n "$${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}" ||
        { echo "falta LANGFUSE_PUBLIC_KEY en .env: ver docs/INSTALACION.md" >&2; exit 1; };
        test -n "$${LANGFUSE_INIT_PROJECT_SECRET_KEY}" ||
        { echo "falta LANGFUSE_SECRET_KEY en .env: ver docs/INSTALACION.md" >&2; exit 1; };
        test -n "$${LANGFUSE_INIT_USER_EMAIL}" ||
        { echo "falta LANGFUSE_ADMIN_EMAIL en .env: ver docs/INSTALACION.md" >&2; exit 1; };
        test -n "$${LANGFUSE_INIT_USER_PASSWORD}" ||
        { echo "falta LANGFUSE_ADMIN_PASSWORD en .env: ver docs/INSTALACION.md" >&2; exit 1; };
        exec dumb-init -- ./web/entrypoint.sh node ./web/server.js --keepAliveTimeout 110000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # #269 — ningún secreto arranca vacío: los que comparte con otros servicios llevan `:?`, y
      # los suyos propios los exige el `entrypoint` de arriba (#318).
      DATABASE_URL: postgresql://${POSTGRES_USER:?falta POSTGRES_USER}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/langfuse
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER:-clickhouse}:${CLICKHOUSE_PASSWORD}@clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://s3:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?falta S3_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?falta S3_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-media
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://s3:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?falta S3_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?falta S3_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: govgenai-org
      LANGFUSE_INIT_ORG_NAME: "Gov Gen AI"
      LANGFUSE_INIT_PROJECT_ID: govgenai-project
      LANGFUSE_INIT_PROJECT_NAME: govgenai
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    deploy:
      resources:
        limits:
          # Medido (#297): con 1024M arranca, corre sus scripts de inicio y muere con
          # «JavaScript heap out of memory», en bucle por el `restart`.
          memory: 2048M
    restart: unless-stopped
    profiles:
      - observabilidad

  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: govgenai_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  s3:
    # #312 — el almacén S3 del compose: lo usa Langfuse y, si se elige, la aplicación
    # (`STORAGE_BACKEND=s3`). SeaweedFS (Apache 2.0) en un solo proceso, que crea sus buckets al
    # arrancar. Antes era MinIO, y sus imágenes dejaron de descargarse sin credenciales: quay.io
    # responde 401 y `minio/minio` en Docker Hub no tiene etiquetas (medido el 2026-10-29).
    #
    # Lo que SeaweedFS trae abierto se cierra aquí: el panel, WebDAV e Iceberg apagados, la
    # telemetría también, y el filer y el volumen piden una firma JWT. La API del maestro queda
    # sin autenticación, a sabiendas: su `[guard]` corta el tráfico interno del propio proceso.
    # Sólo la ve la red `default`; el sandbox está en `sandbox-net`. Detalle en el test de #312.
    image: chrislusf/seaweedfs:4.48
    container_name: govgenai_s3_prod
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/security.toml <<EOF
        [jwt.signing]
        key = "$${AWS_SECRET_ACCESS_KEY}"
        [jwt.signing.read]
        key = "$${AWS_SECRET_ACCESS_KEY}"
        [jwt.filer_signing]
        key = "$${AWS_SECRET_ACCESS_KEY}"
        [jwt.filer_signing.read]
        key = "$${AWS_SECRET_ACCESS_KEY}"
        EOF
        exec /entrypoint.sh mini -dir=/data -s3.port=9000 -master.telemetry=false -admin.ui=false -webdav=false -s3.port.iceberg=0 -bucket=langfuse-events,langfuse-media
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?falta S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?falta S3_SECRET_KEY}
    volumes:
      - s3_data_prod:/data
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # Medido (#312): 70 MB en reposo.
          memory: 256M
    restart: unless-stopped

networks:
  sandbox-net:
    driver: bridge
    internal: true   # PROD: sin egress a internet, solo intercomunicación entre containers conectados

# Nombres pinchados: ver la nota equivalente en docker-compose.yml. En producción
# esto además evita que mover o renombrar el directorio de instalación desconecte
# la base de datos del cliente.
volumes:
  postgres_data_prod:
    name: govgenai-prod_postgres_data_prod
  s3_data_prod:
    name: govgenai-prod_s3_data_prod
  ollama_data:
    name: govgenai-prod_ollama_data
  clickhouse_data_prod:
    name: govgenai-prod_clickhouse_data_prod
  redis_data_prod:
    name: govgenai-prod_redis_data_prod
