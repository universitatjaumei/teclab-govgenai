# Comprueba que cada commit lleva `Signed-off-by`.
#
# Un DCO que nadie comprueba se incumple sin que nadie lo note, y la gracia del DCO es
# poder acreditar la procedencia del código dentro de unos años. Ver `CONTRIBUTING.md`.
#
# Se revisan los commits de cada pull request y los de cada push a `main` y a `desarrollo`:
# la política vale también para el principal, porque un mantenedor que se exceptúa de su
# propia política la deja sin fuerza. `desarrollo` entró el 2026-09-02, cuando el trabajo
# pasó a empujarse ahí para que un push no despliegue: comprobar la firma al llegar a `main`
# sería avisar cuando ya hay veinte commits que rehacer. El historial anterior al 2026-08-21
# queda fuera —es previo a la adopción—, y por eso nunca se recorre el historial completo,
# sólo el tramo nuevo.
name: DCO

on:
  pull_request:
    # `desarrollo` está aquí porque **Dependabot abre sus PR contra esa rama** y, sin esta
    # línea, no se le ejecutaba nada: el 2026-09-20 había **veinte PR suyas con cero
    # comprobaciones**. Una PR sin checks no sale en rojo, sale en blanco, que se parece bastante
    # a un verde cuando se mira por encima.
    #
    # Son dos decisiones correctas que juntas dejaban un hueco: Dependabot apunta a `desarrollo`
    # para no abrir PR contra la rama que despliega, y esto escuchaba sólo `main` porque el
    # trabajo humano llega a `desarrollo` **empujado**, y el disparador de `push` ya lo cubre.
    # Para el robot no vale: su código sólo existe en la rama de la PR hasta que alguien mezcla.
    #
    # No duplica ejecuciones. Lo que una persona abre es `desarrollo → main`, que ya estaba
    # cubierto; las PR **contra** `desarrollo` son hoy sólo las del robot. Y el grupo de
    # concurrencia lleva `github.ref`, que en una PR es `refs/pull/N/merge`: grupo distinto del
    # de un empujón, así que tampoco se cancelan entre sí.
    branches: [main, desarrollo]
  push:
    branches: [main, desarrollo]

# APER.8 — igual que en `ci.yml`: el alcance se declara y no se hereda de la organización.
# Esto sólo lee el historial para recorrer los commits del tramo, así que `contents: read` es
# exactamente lo que necesita — y este workflow corre en cada pull request, también las que
# lleguen de un fork cuando el repositorio sea público.
permissions:
  contents: read

jobs:
  signed-off-by:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Necesita historial para poder recorrer el tramo a revisar.
          fetch-depth: 0

      - name: Determinar el tramo a revisar
        id: tramo
        env:
          EVENTO: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_ANTES: ${{ github.event.before }}
          PUSH_DESPUES: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "pull_request" ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          else
            # Un push que crea la rama, o el primero tras habilitar esto, trae `before` a
            # ceros: no hay tramo anterior con el que comparar y no se revisa nada.
            if [ -z "$PUSH_ANTES" ] || [ "$PUSH_ANTES" = "0000000000000000000000000000000000000000" ]; then
              echo "Push sin referencia anterior; nada que revisar."
              echo "base=" >> "$GITHUB_OUTPUT"
              echo "head=" >> "$GITHUB_OUTPUT"
            elif ! git cat-file -e "$PUSH_ANTES^{commit}" 2>/dev/null; then
              # Tras un push forzado el commit anterior puede no existir ya.
              echo "El commit anterior ($PUSH_ANTES) no existe en este repositorio; nada que revisar."
              echo "base=" >> "$GITHUB_OUTPUT"
              echo "head=" >> "$GITHUB_OUTPUT"
            else
              echo "base=$PUSH_ANTES" >> "$GITHUB_OUTPUT"
              echo "head=$PUSH_DESPUES" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Cada commit lleva Signed-off-by
        if: steps.tramo.outputs.base != ''
        env:
          BASE: ${{ steps.tramo.outputs.base }}
          HEAD: ${{ steps.tramo.outputs.head }}
        run: |
          set -euo pipefail
          shopt -s nocasematch
          fallan=0
          revisados=0
          saltados=0

          # Los robots exentos, uno por línea y con el correo **exacto** (APER.26). Antes esto
          # era un comodín, `*"[bot]@users.noreply.github.com"`, y el comentario de abajo decía
          # que eximir por correo era seguro porque «el nombre lo puede poner cualquiera». El
          # correo también: un `git config user.email` y cualquiera firmaba como
          # `loquesea[bot]@users.noreply.github.com` y se saltaba el DCO entero.
          #
          # Una lista exacta no vuelve el dato infalsificable —sigue siendo texto en un commit—
          # pero deja la exención **estrecha y visible**: para usarla hay que escribir este
          # correo concreto, que es el de una cuenta conocida, y eso se ve en el `git log`.
          # Añadir un robot aquí es un cambio en el repositorio, con su PR y su revisión.
          ROBOTS_EXENTOS="49699333+dependabot[bot]@users.noreply.github.com"
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            mensaje="$(git show -s --format='%B' "$sha")"
            autor="$(git show -s --format='%an <%ae>' "$sha")"
            correo="$(git show -s --format='%ae' "$sha")"
            rotulo="$(git show -s --format='%h %s' "$sha")"

            # APER.13 — Dependabot queda exento, y la razón es lo que el DCO certifica.
            #
            # «I have the right to submit it under the open source license indicated in the
            # file», dice el DCO. Eso lo certifica **una persona** sobre código que aporta.
            # Un robot que sube un número de versión en un `uv.lock` no aporta código de
            # nadie: reordena una resolución de dependencias. No hay autoría que certificar, y
            # exigirle una firma que no puede dar sólo conseguía que **ninguna** de sus PR se
            # pudiera mezclar — trece a la vez el 2026-09-19, todas en rojo por esto.
            #
            # Lo que NO se relaja: la responsabilidad sigue siendo de quien mezcla, y sus PR
            # pasan los mismos checks que las demás.
            #
            # `saltados` se cuenta aparte y se dice en voz alta, porque una exención que no se
            # ve en el registro es una exención que nadie vuelve a revisar.
            #
            # La comparación es contra la lista exacta de arriba (APER.26). `$correo` va entre
            # comillas dentro del patrón **a propósito**: sin ellas, el `[bot]` del correo sería
            # una clase de caracteres de glob y casaría con una sola letra de «b», «o» o «t».
            if [[ " $ROBOTS_EXENTOS " == *" $correo "* ]]; then
              echo "::notice::$rotulo — exento del DCO: commit de robot ($correo)"
              saltados=$((saltados + 1))
              continue
            fi

            revisados=$((revisados + 1))

            # Coincidencia nativa de bash, sin tuberías: `grep -q` cierra la tubería antes de
            # tiempo y en algunos entornos aborta, lo que daba falsos rechazos.
            if [[ ! "$mensaje" =~ (^|$'\n')[[:space:]]*Signed-off-by:[[:space:]]+.+[[:space:]]*\<.+@.+\> ]]; then
              echo "::error::$rotulo — falta Signed-off-by"
              fallan=$((fallan + 1))
            elif [[ "$mensaje" != *"Signed-off-by: $autor"* ]]; then
              echo "::error::$rotulo — el Signed-off-by no coincide con el autor ($autor)"
              fallan=$((fallan + 1))
            fi
          done

          if [ "$fallan" -gt 0 ]; then
            echo
            echo "$fallan de $revisados commit(s) sin firmar. Se arregla con:"
            echo "    git rebase --signoff $BASE"
            echo "    git push --force-with-lease"
            echo
            echo "Que certificas al firmar: fichero DCO en la raiz del repositorio."
            exit 1
          fi
          echo "$revisados commit(s) revisados, todos firmados."
          if [ "$saltados" -gt 0 ]; then
            echo "$saltados commit(s) de robot exentos (ver la razón en este fichero)."
          fi
