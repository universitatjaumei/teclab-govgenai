name: Deploy — VM de GCP

# Despliega la punta de `main` a la VM. Tres decisiones que gobiernan todo lo de abajo:
#
# 1. **Sin claves de larga vida.** La autenticación es Workload Identity Federation: GitHub
#    presenta un token de vida corta y Google lo canjea. Una clave JSON en los secretos del
#    repositorio sería una credencial permanente que nadie rota. No hay ningún secreto de GCP
#    en este repositorio; lo que hay son identificadores públicos en `vars`.
#
# 2. **La etiqueta es el SHA del commit, nunca `latest`.** Con `latest` no se puede saber qué
#    está corriendo ni volver atrás, que son justo las dos preguntas de un incidente.
#
# 3. **Las migraciones van ANTES de cambiar la imagen, en un paso propio y visible.** Una
#    migración que corre dentro del arranque deja el sistema a medias y el motivo enterrado en
#    los logs de un contenedor que se reinicia.
#
# Lo que este workflow NO hace, a propósito:
#   - Desplegar con `git pull` en la VM: lo que corre dependería del estado del disco de la
#     máquina y no de un artefacto identificable.
#   - Ejecutar la suite. Corre en `ci.yml` sobre el mismo commit; repetirla aquí alarga el
#     despliegue sin añadir información.

on:
  push:
    branches: [main]
    # Un commit que sólo toca documentación NO redespliega producción.
    #
    # Medido el 2026-09-01: el commit `16b5f61` tocaba únicamente
    # `planificacion/PROJECT_STATE.md` y disparó un despliegue completo que paró y levantó la
    # pila. Dos consecuencias, las dos malas: producción se reinicia sin motivo —60-90 s sin
    # responder cada vez, y ese día fueron cuatro— y **la vigilancia se vuelve ruido**, porque la
    # alerta de salud dispara en cada reinicio. Llegaban avisos «sin que se haya hecho ningún
    # despliegue»: los había, sólo que de documentación. Y entre los falsos se perdió uno real,
    # el del disco al 85%, que había avisado cuatro horas antes de la caída.
    #
    # La lista es de lo que NO se despliega, no de lo que sí: si mañana aparece un directorio de
    # código nuevo, lo peor que pasa es que se despliegue. Ése es el lado seguro del error.
    #
    # Un commit que toque documentación **y** código sí despliega: `paths-ignore` sólo salta
    # cuando *todos* los ficheros del push encajan en la lista.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "planificacion/**"
      - "pruebas_manuales/**"
      - "LICENSE"
      - "DCO"
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "SHA a desplegar (vacío = el commit actual). Sirve para volver atrás."
        required: false
        type: string

concurrency:
  group: deploy-vm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lo exige la federación de identidad

env:
  VM_NOMBRE: govgenai-vm
  VM_ZONA: europe-southwest1-b
  DESTINO: /opt/govgenai

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # v7, como los otros seis usos del repositorio. Este se quedó en v4 cuando el commit
      # del 2026-08-21 subió las demás, y estuvo un mes así: el repositorio ejecutando dos
      # versiones de la misma acción según el workflow, y la que se quedó atrás era la del
      # despliegue — la que menos corre y la que más cuesta depurar. Lo vigila
      # `tests/infra/test_las_acciones_no_van_a_dos_versiones.py`.
      - uses: actions/checkout@v7

      - name: Etiqueta a desplegar
        id: etiqueta
        run: |
          ETIQUETA="${{ inputs.etiqueta }}"
          if [ -z "$ETIQUETA" ]; then ETIQUETA="${GITHUB_SHA}"; fi
          echo "valor=$ETIQUETA" >> "$GITHUB_OUTPUT"
          echo "Desplegando $ETIQUETA"

      - name: Autenticarse en GCP (sin claves)
        # v3 (PR #59 de Dependabot). Su nota de versión dice «remove old parameters» sin
        # decir cuáles, así que se comparó el `action.yml` de las dos: lo que desaparece es
        # `backoff`, `backoff_limit` y `retries`, y aquí no se pasa ninguno. Las dos
        # entradas que sí se usan —`workload_identity_provider` y `service_account`— siguen
        # existiendo. El cambio de fondo es el runtime, de node20 a node24.
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # v3 (PR #56). Comparados los dos `action.yml`: retira `skip_tool_cache` y añade
      # `cache`, y este paso **no pasa ninguna entrada**, así que nada de lo que cambia le
      # afecta. Como en `auth`, el cambio de fondo es el runtime: node20 a node24.
      - uses: google-github-actions/setup-gcloud@v3

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # ---------------------------------------------------------------------
      # El cliente de la API, ANTES de construir la imagen del frontend.
      #
      # `frontend/src/shared/api/generated/` está en `.gitignore` a propósito: es código
      # generado por Orval desde `openapi.json`, que a su vez lo exporta el backend. O sea que
      # **no viaja en el repositorio**, y `docker build ./frontend` a secas falla con veinte
      # «Cannot find module '@/shared/api/generated/...'». El primer despliegue murió
      # exactamente ahí, y no es un fallo del contenedor: es la arquitectura contract-first
      # diciendo que el contrato se genera, no se guarda.
      #
      # Es la misma secuencia que el job `contract` de ci.yml. Se repite aquí y no se reutiliza
      # porque son workflows distintos; si algún día divergen, el síntoma es este mismo error.
      # ---------------------------------------------------------------------
      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"

      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Dependencias del backend (--locked)
        working-directory: server
        run: uv sync --locked

      - name: Exportar el esquema OpenAPI
        working-directory: server
        run: uv run python export_openapi.py

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Generar el cliente de la API
        working-directory: frontend
        run: npm run generate:api

      - name: Construir y publicar las cuatro imágenes
        id: imagenes
        run: |
          set -euo pipefail
          BASE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}"
          SHA="${{ steps.etiqueta.outputs.valor }}"

          # APER.18 — los modelos locales se eligen aquí, con la variable `GOVGENAI_EXTRAS_APP`
          # del repositorio (vacía = despliegue estándar; `local-models` = con la pila local).
          # La elección es de cada institución, así que vive en su configuración y no en el
          # código.
          EXTRAS_APP=""
          SUFIJO=""
          if [ -n "${{ vars.GOVGENAI_EXTRAS_APP }}" ]; then
            EXTRAS_APP="--extra ${{ vars.GOVGENAI_EXTRAS_APP }}"
            # **La variante va en la etiqueta, y no es cosmético.** `construir_si_falta` no
            # reconstruye si la etiqueta ya está publicada, y la etiqueta es el SHA del commit:
            # sin este sufijo, activar la variable y redespliegar el mismo commit se llevaría la
            # imagen anterior —la que no lleva modelos— sin decir nada. Es el fallo que se busca
            # una hora en el sitio equivocado.
            SUFIJO="-${{ vars.GOVGENAI_EXTRAS_APP }}"
            echo "Construyendo la imagen del servidor con el extra: ${{ vars.GOVGENAI_EXTRAS_APP }}"
          fi

          # Si la etiqueta ya existe —un redespliegue o una vuelta atrás— no se reconstruye.
          #
          # **Los argumentos extra van sueltos, no en una cadena (APER.22).** Antes se pasaban
          # como un quinto parámetro y se soltaban sin comillas para que el shell los partiera:
          # `docker build $argumentos ...`. Funcionaba mientras ningún valor llevara espacios, y
          # el del interruptor los lleva —`--extra local-models`—, así que `docker build` recibía
          # `EXTRAS_APP=--extra` y un `local-models` suelto como segundo contexto, y fallaba.
          # Con `shift 4` y `"$@"` cada argumento llega tal cual lo escribió quien llama, que es
          # lo que hay que hacer siempre que un valor pueda contener un espacio.
          construir_si_falta() {
            local nombre="$1" contexto="$2" dockerfile="$3" etiqueta="$4"
            shift 4
            if gcloud artifacts docker images describe "$BASE/$nombre:$etiqueta" >/dev/null 2>&1; then
              echo "  $nombre:$etiqueta ya está publicada"
              return
            fi
            docker build "$@" -t "$BASE/$nombre:$etiqueta" -f "$dockerfile" "$contexto"
            docker push "$BASE/$nombre:$etiqueta"
          }

          # La versión sale del fichero `VERSION` de la raíz, que es la fuente única, y se
          # estampa en la imagen. Sin esto la imagen de producción se construiría con el defecto
          # y **mentiría sobre su versión**, que es peor que no llevarla: quien reporte un fallo
          # diría un número que no corresponde a lo que ejecuta.
          VERSION_DEL_DESPLIEGUE="$(tr -d '[:space:]' < VERSION)"
          echo "  versión: $VERSION_DEL_DESPLIEGUE"

          construir_si_falta app . Dockerfile "$SHA$SUFIJO" \
            --build-arg "EXTRAS_APP=$EXTRAS_APP" \
            --build-arg "GOVGENAI_VERSION=$VERSION_DEL_DESPLIEGUE"
          construir_si_falta frontend ./frontend ./frontend/Dockerfile "$SHA"
          construir_si_falta sandbox ./services/script_sandbox ./services/script_sandbox/Dockerfile "$SHA"
          construir_si_falta mcp ./mcp_server ./mcp_server/Dockerfile "$SHA"

          # La del servidor lleva `$SUFIJO` porque es la única que puede tener variante, y hay
          # que desplegar **la etiqueta que se acaba de publicar**, no la que se supone. Sin
          # esto, con el interruptor puesto se sube `app:$SHA-local-models` y a la VM se le pasa
          # `app:$SHA`, que en esta ejecución no ha construido nadie: o falla al tirar de ella,
          # o arrastra en silencio la imagen sin modelos de un despliegue anterior del mismo
          # commit — que es exactamente el fallo que el sufijo venía a cerrar.
          echo "app=$BASE/app:$SHA$SUFIJO" >> "$GITHUB_OUTPUT"
          echo "frontend=$BASE/frontend:$SHA" >> "$GITHUB_OUTPUT"
          echo "sandbox=$BASE/sandbox:$SHA"   >> "$GITHUB_OUTPUT"
          echo "mcp=$BASE/mcp:$SHA"           >> "$GITHUB_OUTPUT"

      - name: Copiar los ficheros de despliegue a la máquina
        run: |
          set -euo pipefail
          # Issue #184 — la clave efímera puede no haber propagado; se reintenta la
          # conexión y nada más. El comando de abajo va una sola vez.
          bash scripts/vm_espera_ssh.sh
          # Se copian los artefactos, no el repositorio: en la VM no hay working copy que
          # pueda divergir de lo que se cree que está desplegado.
          tar czf despliegue.tgz \
            deploy/vm/docker-compose.vm.yml \
            deploy/vm/Caddyfile \
            deploy/vm/govgenai.service \
            deploy/vm/sites.d/dominio.caddy.tpl \
            scripts/vm_fetch_secrets.sh \
            scripts/vm_fetch_tls.sh \
            scripts/lib/secretos.tsv

          gcloud compute scp despliegue.tgz \
            "${VM_NOMBRE}:/tmp/despliegue.tgz" \
            --zone "$VM_ZONA" --tunnel-through-iap --quiet

          gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap --quiet \
            --command "sudo mkdir -p ${DESTINO}/scripts/lib ${DESTINO}/deploy/vm/sites.d ${DESTINO}/sites.d ${DESTINO}/tls && sudo tar xzf /tmp/despliegue.tgz -C /tmp && \
              sudo cp /tmp/deploy/vm/docker-compose.vm.yml ${DESTINO}/ && \
              sudo cp /tmp/deploy/vm/Caddyfile ${DESTINO}/ && \
              sudo cp /tmp/deploy/vm/sites.d/dominio.caddy.tpl ${DESTINO}/deploy/vm/sites.d/ && \
              sudo cp /tmp/scripts/vm_fetch_secrets.sh /tmp/scripts/vm_fetch_tls.sh ${DESTINO}/scripts/ && \
              sudo cp /tmp/scripts/lib/secretos.tsv ${DESTINO}/scripts/lib/ && \
              sudo chmod +x ${DESTINO}/scripts/vm_fetch_secrets.sh ${DESTINO}/scripts/vm_fetch_tls.sh && \
              sudo cp /tmp/deploy/vm/govgenai.service /etc/systemd/system/ && \
              sudo systemctl daemon-reload && sudo systemctl enable govgenai && \
              sudo rm -rf /tmp/deploy /tmp/scripts /tmp/despliegue.tgz"
        # `sudo rm` y no `rm`: la extracción es `sudo tar`, así que los ficheros quedan de
        # root y el usuario del SSH no puede borrarlos. El tercer despliegue real murió aquí,
        # con todo lo importante ya hecho —ficheros copiados y unidad habilitada— y sólo la
        # limpieza fallando. Un `Permission denied` al final es igual de rojo que uno al
        # principio, y eso es lo correcto: si la limpieza no se puede completar, el siguiente
        # despliegue extraería sobre ficheros ajenos.

      - name: Refrescar el guion de arranque de la máquina
        run: |
          set -euo pipefail
          # GCE lee el guion de arranque de los **metadatos de la instancia**, fijados al
          # crearla. Editarlo en el repositorio no cambia la máquina, ni reiniciando: al cerrar
          # D.6-VM se descubrió que la VM llevaba horas ejecutando la versión original, así que
          # el agente de operaciones y la rotación de logs nunca se habían instalado — y sin el
          # agente, las alertas de memoria y disco no pueden dispararse.
          #
          # Refrescarlo en cada despliegue mantiene la misma regla que el resto del workflow: lo
          # que corre viene de un artefacto identificable, no del estado del disco de la máquina.
          # No se ejecuta aquí: correrá en el siguiente arranque, y es idempotente.
          gcloud compute instances add-metadata "$VM_NOMBRE" --zone "$VM_ZONA" \
            --metadata-from-file startup-script=deploy/vm/startup.sh --quiet

      - name: Guardar la configuración anterior (el camino de vuelta)
        id: anterior
        run: |
          set -euo pipefail
          # Issue #184 — la clave efímera puede no haber propagado; se reintenta la
          # conexión y nada más. El comando de abajo va una sola vez.
          bash scripts/vm_espera_ssh.sh
          # Se guarda el fichero ENTERO, no sólo la etiqueta de `app`. La primera versión
          # rehacía con `sed` la línea de la imagen de la aplicación y dejaba las del frontend
          # y del sandbox apuntando a la versión nueva: una vuelta atrás a medias es un estado
          # que nadie ha probado. Copiar el fichero revierte las tres de golpe.
          HAY="$(gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap \
            --quiet --command "if [ -f ${DESTINO}/.env.despliegue ]; then sudo cp ${DESTINO}/.env.despliegue ${DESTINO}/.env.despliegue.anterior && echo si; else echo no; fi" \
            | tr -d '\r\n')"
          echo "hay=$HAY" >> "$GITHUB_OUTPUT"
          echo "Configuración anterior guardada: $HAY"

      - name: Escribir la configuración del despliegue
        run: |
          set -euo pipefail
          # Issue #184 — la clave efímera puede no haber propagado; se reintenta la
          # conexión y nada más. El comando de abajo va una sola vez.
          bash scripts/vm_espera_ssh.sh
          # Estas NO son credenciales: son identificadores y rutas. Los secretos los baja la
          # propia máquina de Secret Manager (D.2) y nunca pasan por aquí.
          #
          # `GOVGENAI_SOURCE_URL` sin definir deja la línea vacía, y eso es lo que se quiere:
          # el §13 obliga a quien ejecuta una versión **modificada**, así que un despliegue
          # sin modificar no tiene enlace que ofrecer. Sale de una variable del repositorio
          # y no de una constante porque lo que hay que ofrecer es el fuente de **esa**
          # versión: una URL fija al principal haría que un fork incumpliera creyendo que
          # cumple (issue #41).
          gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap --quiet \
            --command "sudo tee ${DESTINO}/.env.despliegue > /dev/null <<'EOF'
          GOVGENAI_IMAGE=${{ steps.imagenes.outputs.app }}
          GOVGENAI_FRONTEND_IMAGE=${{ steps.imagenes.outputs.frontend }}
          GOVGENAI_SANDBOX_IMAGE=${{ steps.imagenes.outputs.sandbox }}
          GOVGENAI_MCP_IMAGE=${{ steps.imagenes.outputs.mcp }}
          GOVGENAI_HOST=${{ vars.GOVGENAI_HOST }}
          CLOUDSQL_CONNECTION_NAME=${{ vars.CLOUDSQL_CONNECTION_NAME }}
          STORAGE_BUCKET=${{ vars.STORAGE_BUCKET }}
          GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION=${{ vars.GCP_REGION }}
          CORPUS_SITE_BASE_URL=${{ vars.CORPUS_SITE_BASE_URL }}
          CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
          CORPUS_BUCKET=${{ vars.CORPUS_BUCKET }}
          GOVGENAI_HOST_INSTITUCIONAL=${{ vars.GOVGENAI_HOST_INSTITUCIONAL }}
          SOURCE_URL=${{ vars.GOVGENAI_SOURCE_URL }}
          GOOGLE_OAUTH_ALLOWED_DOMAIN=${{ vars.GOOGLE_OAUTH_ALLOWED_DOMAIN }}
          GOOGLE_OAUTH_REDIRECT_URI=${{ vars.GOOGLE_OAUTH_REDIRECT_URI }}
          DEPLOY_MODE=all
          EOF
          sudo chmod 644 ${DESTINO}/.env.despliegue"

      # ANTES de que la máquina descargue las imágenes nuevas, y ésa es toda la gracia de la
      # posición. En este punto los contenedores siguen apuntando a la generación actual, y
      # `prune -a` conserva exactamente lo que algún contenedor referencia y borra el resto: se
      # conserva la actual, se libera todo lo anterior, y la descarga que viene tiene sitio
      # garantizado. Después del reinicio la generación anterior se queda en local sin
      # contenedor, así que **una vuelta atrás es instantánea** en vez de volver a bajar 2,26 GB.
      # Estado estacionario: dos generaciones en disco, unos 6 GB.
      #
      # Limpiar sólo tras un despliegue exitoso NO habría evitado el incidente: el 2026-09-01 el
      # disco ya estaba lleno al empezar, así que la limpieza condicionada al éxito no se habría
      # ejecutado nunca cuando hacía falta. Diez despliegues habían dejado 30 imágenes y 25,2 GB
      # en un disco de 30 GB, y el `docker compose up` murió con `no space left on device` al
      # crear el socket del proxy de Cloud SQL. El síntoma no señalaba al disco —«container
      # govgenai_sql_proxy is unhealthy»— y, al fallar el paso de desplegar, el de reversión se
      # saltó y el servicio se quedó caído.
      #
      # `|| true` porque quedarse sin limpiar no es motivo para abortar un despliegue.
      - name: Hacer sitio en el disco antes de bajar las imágenes
        run: |
          # Issue #184 — la clave efímera puede no haber propagado; se reintenta la
          # conexión y nada más. El comando de abajo va una sola vez.
          bash scripts/vm_espera_ssh.sh
          gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap --quiet \
            --command "sudo docker image prune -af || true; df -h / | tail -1" || true

      - name: Bajar los secretos y levantar el proxy de Cloud SQL
        run: |
          # Issue #184 — la clave efímera puede no haber propagado; se reintenta la
          # conexión y nada más. El comando de abajo va una sola vez.
          bash scripts/vm_espera_ssh.sh
          gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap --quiet \
            --command "cd ${DESTINO} && sudo ./scripts/vm_fetch_secrets.sh \
              --project ${{ vars.GCP_PROJECT_ID }} --out ${DESTINO}/.env.runtime && \
              sudo docker compose --env-file ${DESTINO}/.env.despliegue \
                -f ${DESTINO}/docker-compose.vm.yml up -d cloud-sql-proxy"

      - name: Migraciones (antes de cambiar la imagen)
        run: |
          set -euo pipefail
          # Issue #184 — la clave efímera puede no haber propagado; se reintenta la
          # conexión y nada más. El comando de abajo va una sola vez.
          bash scripts/vm_espera_ssh.sh
          # Paso propio y con la salida en el log: si Alembic falla, el despliegue se detiene
          # aquí y la imagen vieja sigue sirviendo.
          gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap --quiet \
            --command "cd ${DESTINO} && sudo docker compose --env-file ${DESTINO}/.env.despliegue \
              -f ${DESTINO}/docker-compose.vm.yml --profile migrate run --rm migrate"

          echo '--- revisión aplicada ---'
          gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap --quiet \
            --command "cd ${DESTINO} && sudo docker compose --env-file ${DESTINO}/.env.despliegue \
              -f ${DESTINO}/docker-compose.vm.yml --profile migrate run --rm --entrypoint alembic migrate current"

      # Sembrar el catálogo de plantillas, que hasta el 2026-09-22 **no se hacía nunca**.
      #
      # `bootstrap` exigía `--superadmin-email` y `--superadmin-password` para cualquier trabajo,
      # y en producción esas variables no existen: la siembra sólo podía hacerla una persona por
      # SSH aportando credenciales a mano, así que no se hacía. Producción llevaba desde el
      # primer despliegue con **cero plantillas** sin que nada lo dijera.
      #
      # `--solo-demo` no pide credenciales —el catálogo se firma con `AUTOR_DEL_SEMBRADO`, no con
      # la cuenta del superadministrador— y es idempotente, así que puede correr en cada
      # despliegue (issue #97).
      #
      # Va **después de las migraciones y antes de cambiar la imagen**, por la misma razón que
      # ellas: si falla, el despliegue se detiene aquí y la imagen vieja sigue sirviendo. Y con
      # la salida en el log, porque una siembra silenciosa que no siembra nada es exactamente lo
      # que nos tuvo meses con el catálogo vacío.
      - name: Sembrar el catálogo de plantillas (idempotente)
        run: |
          set -euo pipefail
          # Issue #184 — la clave efímera puede no haber propagado; se reintenta la
          # conexión y nada más. El comando de abajo va una sola vez.
          bash scripts/vm_espera_ssh.sh
          gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap --quiet \
            --command "cd ${DESTINO} && sudo docker compose --env-file ${DESTINO}/.env.despliegue \
              -f ${DESTINO}/docker-compose.vm.yml --profile migrate run --rm \
              --entrypoint python migrate -m server.app.scripts.bootstrap --solo-demo"

      - name: Desplegar
        run: |
          # Issue #184 — la clave efímera puede no haber propagado; se reintenta la
          # conexión y nada más. El comando de abajo va una sola vez.
          bash scripts/vm_espera_ssh.sh
          gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap --quiet \
            --command "sudo systemctl restart govgenai && sleep 20 && \
              sudo docker compose --env-file ${DESTINO}/.env.despliegue \
                -f ${DESTINO}/docker-compose.vm.yml ps"

      # `if: always()`, y lo enseñaron DOS incidentes.
      #
      # Este paso es la red de seguridad del despliegue: comprueba que el servicio responde y, si
      # no, vuelve a la imagen anterior. Sin `always()` **se salta justo cuando hace falta**,
      # porque en GitHub Actions un paso fallido salta todo lo que viene detrás: si «Desplegar»
      # muere, la reversión no corre y el servicio se queda caído en vez de volver atrás.
      #
      # Pasó el 2026-09-01 (el disco lleno) y quedó anotado en `PROJECT_STATE.md` como «merece
      # mirarse». No se miró, y volvió a pasar el 2026-09-15: `uvicorn` salió del conjunto base
      # al mover `browser-use` a un extra, el contenedor no arrancó, y producción estuvo caída
      # media hora **con la reversión preparada y sin ejecutar**. Dos veces el mismo coste por la
      # misma línea que faltaba.
      #
      # `continue-on-error` NO sirve aquí: dice «si este paso falla, no tumbes el job», no
      # «ejecútalo aunque uno anterior fallara». Son cosas distintas y es la tercera vez que esa
      # confusión cuesta algo en este repositorio.
      - name: Comprobar que sirve, y volver atrás si no
        if: always()
        run: |
          set -uo pipefail
          # Issue #184 — la clave efímera puede no haber propagado; se reintenta la conexión y
          # nada más.
          #
          # **Aquí la sonda NO puede ser mortal**, y es el único sitio donde eso importa: este
          # paso es la red de seguridad, y con el `-e` que GitHub pone por omisión un fallo suyo
          # abortaría el paso antes de intentar la reversión. O sea que arreglar el despliegue
          # habría creado una forma nueva de quedarse caído sin volver atrás — justo lo que
          # `if: always()` vino a impedir. Si no hay SSH, se sigue y lo dirá quien lo necesite.
          bash scripts/vm_espera_ssh.sh || echo "::warning::sin SSH tras los reintentos; se sigue igualmente"
          HOST="${{ vars.GOVGENAI_HOST }}"
          ok=0
          for intento in 1 2 3 4 5 6; do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/health" || true)"
            if [ "$codigo" = "200" ]; then ok=1; break; fi
            echo "intento $intento: /health devolvió ${codigo:-sin respuesta}"
            sleep 15
          done

          if [ "$ok" = "1" ]; then
            echo "/health responde 200 por TLS"

            # La documentación de la API tiene que estar cerrada en producción (SEC.7).
            #
            # **NO se comprueba `https://$HOST/docs`.** Esa ruta la sirve el FRONTEND: es una
            # SPA con catch-all, así que devuelve `index.html` con 200 para cualquier camino.
            # La primera versión de este paso miraba ahí, leyó ese 200 como «documentación
            # abierta» y **revirtió un despliegue que funcionaba**. La comprobación medía el
            # frontend creyendo medir la API.
            #
            # Se comprueba donde de verdad vive: bajo el prefijo de la API desde fuera, y
            # —lo que es autoritativo— dentro del contenedor, que es donde SEC.7 actúa.
            for ruta in /api/v1/docs /api/v1/openapi.json; do
              codigo="$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST$ruta" || true)"
              echo "$ruta devuelve $codigo (se espera 404)"
              [ "$codigo" != "200" ] || { echo "::error::$ruta abierta en produccion"; ok=0; }
            done

            interno="$(gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap \
              --quiet --command "sudo docker exec govgenai_app curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/docs" | tr -d '\r\n')"
            echo "la aplicacion sirve /docs con codigo $interno (se espera 404)"
            [ "$interno" = "404" ] || { echo "::error::la aplicacion expone /docs"; ok=0; }

            # El MCP (issue #91). No lo miraba nadie: podía quedarse sirviendo errores con
            # Docker diciendo `Up`, y la reversión automática no se disparaba.
            #
            # Se lee **su sonda**, no una ruta a mano, porque la sonda es la que decide en
            # producción y comprobar otra cosa la dejaría sin probar. `--factory` hace que la
            # aplicación se construya al arrancar, así que un fallo de construcción sólo se ve
            # con el proceso en marcha.
            #
            # `starting` cuenta como fallo a propósito: si tras el reinicio y la espera sigue
            # arrancando, algo va mal. `sin-sonda` también, porque significa que la imagen
            # desplegada es anterior a este arreglo o que alguien quitó el HEALTHCHECK.
            salud_mcp="$(gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap \
              --quiet --command "sudo docker inspect -f '{{.State.Health.Status}}' govgenai_mcp 2>/dev/null || echo sin-sonda" | tr -d '\r\n')"
            echo "el MCP dice estar «$salud_mcp» (se espera healthy)"
            [ "$salud_mcp" = "healthy" ] || { echo "::error::el MCP no esta sano: $salud_mcp"; ok=0; }
          fi

          if [ "$ok" != "1" ]; then
            if [ "${{ steps.anterior.outputs.hay }}" != "si" ]; then
              echo "::error::El despliegue no responde y no hay configuración anterior a la que volver."
              exit 1
            fi
            echo "::warning::Volviendo a la configuración anterior"
            # Se restaura el fichero entero y se reinicia. Nada de `sed` con variables: la
            # primera versión mandaba `${ANTERIOR}` escapado, así que la expandía el intérprete
            # de la MÁQUINA —donde no existe— y el `sed` dejaba `GOVGENAI_IMAGE=` vacío. A
            # partir de ahí compose no podía interpolar ni para levantar ni para bajar, y como
            # `ExecStop` es el mismo compose, la pila se quedó a medias.
            gcloud compute ssh "$VM_NOMBRE" --zone "$VM_ZONA" --tunnel-through-iap --quiet \
              --command "sudo cp ${DESTINO}/.env.despliegue.anterior ${DESTINO}/.env.despliegue && sudo systemctl restart govgenai"
            echo "::error::Despliegue revertido. Mira los logs de la aplicación antes de reintentar."
            exit 1
          fi
