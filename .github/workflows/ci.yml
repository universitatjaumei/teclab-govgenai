name: CI — Gov Gen AI Platform

on:
  push:
    # `desarrollo` está aquí y NO en `deploy.yml`, y ésa es toda la gracia: desde el
    # 2026-09-02 el trabajo se empuja a esa rama para que un push no despliegue producción,
    # y `main` se reserva para desplegar (por bloque o conjunto de bloques). Sin esta línea,
    # empujar a la rama no ejecutaría **nada**: se perdería la comprobación que hoy corre en
    # cada push, que no es lo que se quería evitar.
    branches: [main, desarrollo]
  pull_request:
    # `desarrollo` está aquí porque **Dependabot abre sus PR contra esa rama** y, sin esta
    # línea, no se le ejecutaba nada: el 2026-09-20 había **veinte PR suyas con cero
    # comprobaciones**. Una PR sin checks no sale en rojo, sale en blanco, que se parece bastante
    # a un verde cuando se mira por encima.
    #
    # Son dos decisiones correctas que juntas dejaban un hueco: Dependabot apunta a `desarrollo`
    # para no abrir PR contra la rama que despliega, y esto escuchaba sólo `main` porque el
    # trabajo humano llega a `desarrollo` **empujado**, y el disparador de `push` ya lo cubre.
    # Para el robot no vale: su código sólo existe en la rama de la PR hasta que alguien mezcla.
    #
    # No duplica ejecuciones. Lo que una persona abre es `desarrollo → main`, que ya estaba
    # cubierto; las PR **contra** `desarrollo` son hoy sólo las del robot. Y el grupo de
    # concurrencia lleva `github.ref`, que en una PR es `refs/pull/N/merge`: grupo distinto del
    # de un empujón, así que tampoco se cancelan entre sí.
    branches: [main, desarrollo]

# Un `push` que llega mientras corre el anterior lo cancela, en vez de pagar los dos.
#
# Aquí importa por cómo se trabaja en este proyecto: el desarrollo va por bloques y se sube
# una tanda de commits al cerrar uno, así que sin esto GitHub arranca un run por commit y
# factura todos aunque solo el último interese. Con `github.ref` en el grupo, `main` y cada
# pull request se cancelan por separado.
#
# **El precio, dicho**: el commit intermedio se queda sin check propio, marcado como
# cancelado. Es aceptable porque lo que se despliega es la punta de la rama, no un commit del
# medio; si algún día hace falta el estado de cada commit —una bisección sobre resultados de
# CI, por ejemplo— esto es lo primero que hay que quitar.
# APER.8 — el alcance del GITHUB_TOKEN se declara aquí, y no se hereda de la organización.
#
# Sin esta línea lo decidía la configuración de `universitatjaumei`, que este repositorio no
# gobierna. Y el momento importa: con el repositorio privado, quien abre una pull request es
# alguien de dentro; **en público cualquiera puede abrir una desde un fork** y con ella ejecutar
# todo esto. La diferencia entre un token que lee el código y uno que puede escribir en el
# repositorio es, en ese contexto, toda la diferencia.
#
# `contents: read` basta para lo que hace CI: descargar el código y subir artefactos —
# `upload-artifact` no usa este token—. Ningún job comenta en pull requests, publica releases ni
# empuja ramas; el día que uno lo necesite, lo pide **ese job** y no el workflow entero. Lo
# comprueba `server/tests/infra/test_aper8_los_workflows_declaran_sus_permisos.py`, que exige una
# razón escrita para cada escritura.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: govgenai
          POSTGRES_USER: govgenai
          POSTGRES_PASSWORD: govgenai_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govgenai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://govgenai:govgenai_dev@localhost:5432/govgenai
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "60"
      # GOOGLE_API_KEY no se necesita: los tests unitarios/integración mockean el LLM
      # CI no levanta el microservicio del sandbox, así que `SANDBOX_BASE_URL` apuntaría a
      # `script-sandbox:5000` —un nombre de la red de Docker— y los dos tests que hablan con
      # él esperarían 30 s antes de fallar con `422 TEST_FAILED: Timeout`, que no parece un
      # problema de entorno. `TESTING=1` conmuta `sandbox_mode` a `local`, y está documentado
      # en `.env.example` para el mismo caso en desarrollo.
      TESTING: "1"

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # `--locked` afirma que `uv.lock` cuadra con `pyproject.toml`, y falla si no.
      #
      # Sin él, uv **vuelve a resolver en silencio**: «The project is re-locked before syncing
      # unless `--locked` or `--frozen` is provided», dicen sus propias páginas. O sea que un lock
      # caducado no daba ningún síntoma aquí — CI instalaba un conjunto de dependencias que el
      # lock no describía y el check seguía verde. Fue exactamente lo que pasó con el lock de la
      # raíz: EXT.3 retiró Docling del manifiesto el 2026-08-11, nadie regeneró el lock, y el
      # desajuste vivió **17 días** sin que nada lo dijera; sólo se veía como un fichero
      # modificado que reaparecía en el árbol del desarrollador y que, por prudencia, no se
      # commiteaba nunca.
      #
      # Va aquí y no en un paso propio de `uv lock --check`, a propósito: como `uv sync` relockea
      # antes de sincronizar, un paso de comprobación colocado DESPUÉS de la instalación no puede
      # fallar nunca —el fichero ya estaría reescrito—. Tendría que ir antes, y entonces afirma lo
      # mismo que este flag en dos sitios. Un mecanismo, no dos.
      #
      # **El precio, dicho**: el día que alguien edite un `pyproject.toml` sin relockear, esto se
      # pone rojo. Es lo que se quiere; por eso el paso lleva la razón en el nombre, para que no se
      # lea como una avería de infraestructura.
      - name: Install dependencies (--locked, el lock tiene que cuadrar con pyproject)
        run: uv sync --locked --all-extras

      # **`app` y `tests`, los dos (issue #48).** Durante meses esto lintaba sólo `app`, y
      # `tests` acumuló 225 avisos: 146 imports que ya no apuntaban a nada, 46 variables
      # llamadas `l` dentro de comprensiones que deciden qué mide un guardarraíl, y una docena
      # de f-strings sin sustitución en mensajes de aserto.
      #
      # La suite de este proyecto no es código de segunda: los guardarraíles viven ahí y son el
      # mecanismo con el que se hace cumplir media especificación. Un import muerto o una
      # comprensión mal leída son justo los defectos que hacen que un guardarraíl mida menos de
      # lo que dice, que es el modo de fallo recurrente de este repositorio.
      - name: Lint (ruff)
        run: uv run ruff check app/ tests/

      # **Comprobación de tipos, por módulo (issue #49).** El alcance NO está aquí: está en
      # `[tool.pyright]` de `server/pyproject.toml`, que es donde se lee junto con la razón de
      # cada ampliación. Hoy cubre `app/core/`, que es lo compartido y lo que más se importa.
      #
      # Encenderlo sobre el árbol entero daría cientos de avisos y acabaría desactivado, que es
      # como mueren estas herramientas. Se amplía módulo a módulo, cada uno con su commit, y el
      # siguiente está escrito en el manifiesto para que ampliar no dependa de que alguien se
      # acuerde.
      - name: Tipos (pyright, por módulo)
        run: uv run pyright

      # El contrato OpenAPI está en `.gitignore` —es un artefacto generado, no se edita a
      # mano— y `tests/test_openapi_export.py` comprueba que existe y que es OpenAPI 3.x.
      # Mientras CI corría el 42% de la suite ese fichero no se colectaba; al pasar a
      # `tests` entero (e0b2eb3) los dos tests de presencia se pusieron en rojo, porque en
      # este job nadie ejecutaba el exportador: solo lo hace el job `contract`, que es otra
      # máquina y otro checkout.
      #
      # Se genera aquí en vez de relajar los tests porque el exportador es offline (no
      # levanta Uvicorn ni toca la BD), cuesta segundos, y de paso convierte en aserción
      # real el `test_server_openapi_json_is_valid`, que hasta ahora se saltaba en CI por
      # falta del fichero.
      - name: Export OpenAPI schema (lo exige tests/test_openapi_export.py)
        run: uv run python export_openapi.py

      # BD.2 — el esquema lo define Alembic y SOLO Alembic, y esto es lo que lo demuestra.
      #
      # Hasta el 2026-09-04 la aplicación hacía además `create_all` al arrancar. Esa segunda
      # fuente nunca borra lo que dejó de estar declarado, y así quedaron 36 tablas de modelos
      # retirados en la base de desarrollo sin que nada lo dijera (BD.1). Y una deriva más fina
      # que un censo de tablas no ve: tres columnas `nullable=True` en su migración y `NOT NULL`
      # en su modelo, durante semanas, en producción también.
      #
      # `alembic check` compara los modelos con la base y falla si difieren. Tiene que ir DESPUÉS
      # de `upgrade head`: contra una base vacía propondría crearlo todo y estaría siempre rojo, y
      # un guardarraíl siempre rojo se desactiva. Cuesta segundos. Cuando esté rojo, la lectura es
      # una de dos: un modelo cambiado sin su migración, o una migración que dijo otra cosa que
      # el modelo. Las dos son un motivo para no fusionar.
      - name: Schema is defined by Alembic alone (upgrade head, then alembic check)
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # Unit + integration + e2e en UNA sola invocación de pytest, a propósito (TST.1):
      # separados en dos procesos, el estado filtrado entre tests —un mock asignado a
      # una clase, un singleton contaminado— es invisible para CI. Así fue como
      # `WebSiteRepo.create = AsyncMock(...)` rompió 10 tests de integración durante
      # meses sin que ningún build se enterara.
      #
      # `-n0` desactiva el paralelismo que TST.4 puso por defecto en `addopts`, y es la otra
      # mitad de la misma razón: con 16 workers los tests se reparten entre procesos y el
      # estado filtrado vuelve a ser invisible, que es exactamente lo que este paso existe
      # para cazar. En local manda la velocidad; aquí manda la detección, y CI puede
      # permitirse los minutos.
      # `tests` entero, y no una lista de rutas. La lista que había aquí cubría 1.187 de los
      # 2.811 tests de la suite: **el 42%**. Fuera quedaban `tests/modules/redaccion` (647
      # tests) y `tests/modules/curation` (413), los dos módulos con más tests del proyecto,
      # más `tests/public_graphs` entero y todo `tests/api` salvo cuatro ficheros. Un rojo ahí
      # dejaba el check en verde, que es el mismo agujero que SEC.8.7 cerró para el árbol de
      # la raíz — y así pasaron inadvertidos los dos tests del sandbox que dependían de un
      # servicio ausente.
      #
      # Se pone `tests` y no una lista más larga **a propósito**: una lista vuelve a
      # desalinearse en cuanto alguien añade un directorio, y nadie se entera porque el
      # síntoma es un check verde. Medido: los directorios que faltaban tardan 2:33 en serie,
      # así que la cobertura completa cuesta minutos, no el triple del gate.
      #
      # Los dos gates de abajo repiten unos pocos de estos tests. La duplicación es
      # deliberada: cuesta segundos y compra que un fallo de aislamiento entre organizaciones
      # se lea como «no despliegues» y no como «un test en rojo».
      - name: Run the whole backend suite (single invocation, needs PostgreSQL)
        run: |
          uv run pytest \
            tests \
            -n0 \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      # SEC.8.7 cerró aquí un agujero: CI corre con `working-directory: server`, así que sólo
      # veía `server/tests`, y el árbol `tests/` de la RAÍZ acumuló durante meses doce rojos y
      # dos errores de colección sin que ningún check se pusiera rojo. Se colectaba, que es
      # barato y caza un import a un módulo que ya no existe.
      #
      # **NIC.4 retiró ese árbol** (2026-09-04): sus tests vivos se migraron a `server/tests`,
      # que este job ejecuta entero, y los huérfanos se fueron con el NiceGUI. El paso se
      # quedó sin sujeto — y borrarlo sin más habría dejado el agujero abierto en otro sitio,
      # porque **`shared/tests` y `mcp_server/tests` seguían igual de fuera**.
      #
      # Se **ejecutan** en vez de colectarse, y la razón la dio la medición: los dos rojos que
      # `shared/tests` tenía escondidos —`FieldDefinition`, retirado de `automatia_shared.dtos`
      # sin que nadie repuntara sus tests— importaban **dentro** de la función, así que un
      # `--collect-only` los habría dejado pasar. Cuestan 14 segundos entre los dos.
      # `--directory mcp_server` y `--extra dev`, y las dos cosas son la misma lección.
      # El primer intento fue `uv run --project mcp_server pytest mcp_server/tests` y CI dio
      # `error: Failed to spawn: pytest`. En local pasaba, porque el venv de `mcp_server/` ya
      # tenía pytest de sesiones anteriores; en CI se crea limpio, y `pytest` está declarado en
      # `[project.optional-dependencies] dev` —un EXTRA, no un grupo—, que `uv run` no instala
      # salvo que se le pida. `--directory` además pone el cwd dentro del proyecto, que es donde
      # su `[tool.pytest.ini_options]` (`testpaths`, `pythonpath = ["."]`) significa lo que dice.
      - name: Run the trees the server job does not see (shared, mcp_server)
        working-directory: ${{ github.workspace }}
        run: |
          uv run --project server pytest shared/tests -q --no-cov -p no:cacheprovider
          uv run --directory mcp_server --extra dev pytest tests -p no:cacheprovider

      # Gate de aislamiento entre organizaciones (SEC.2, hallazgo A2). Paso PROPIO y no
      # una carpeta más del paso anterior, a propósito: si esto se pone en rojo hay acceso
      # horizontal entre organizaciones —un admin viendo chatbots y conversaciones de otra
      # administración— y eso no es «un test que falla», es un motivo para no desplegar.
      # Separarlo hace que se lea así en la lista de checks y que nadie lo confunda con una
      # regresión funcional cualquiera.
      # SEC.2.1 añade a este paso el modo de acceso por chatbot y la identidad delegada.
      # Van con el aislamiento y no con el resto de la suite por la misma razón: un chatbot
      # restringido que se abre, o una cabecera de actor que concede organizaciones, no son
      # «un test en rojo», son un motivo para no desplegar.
      # SEC.9.5 amplía este paso, y la razón es que los cuatro agujeros de SEC.9 estaban
      # justamente donde no miraba: la lista de abajo no incluía ninguno de los routers
      # añadidos en los bloques REV y MT. `test_router_inventory_is_walked.py` deja de
      # depender de que alguien amplíe esta lista —recorre el árbol de routers— y los tres
      # ficheros de aislamiento nuevos entran aquí porque un modelo, un prompt de plataforma
      # o el catálogo de automatizaciones cruzando de organización tampoco son «un test en
      # rojo»: son un motivo para no desplegar.
      - name: Access control gate — tenancy, chatbot access mode, delegated actor (blocks deploy)
        run: |
          uv run pytest \
            tests/api/test_tenant_isolation.py \
            tests/api/test_router_inventory_is_walked.py \
            tests/api/test_library_router_auth.py \
            tests/api/test_llm_configs_isolation.py \
            tests/api/test_activity_prompts_isolation.py \
            tests/modules/agents_hub/integration/test_mt16_aislamiento_dos_organizaciones.py \
            tests/api/test_chatbot_access_mode.py \
            tests/core/auth/test_delegated_actor.py \
            tests/api/test_auth_login.py \
            -n0 \
            --no-cov \
            -v

      # Gate de regresión del retrieval (RAG.1). Mide el MECANISMO de recuperación
      # —fusión híbrida, filtros, ranking— sobre el corpus de fixture con un embedding
      # determinista, así que es reproducible y corre en segundos. NO mide BGE-M3: eso
      # exige el corpus real y va por `python -m ...evaluation.run_golden`, a mano.
      # Falla solo si recall@5, recall@10 o MRR bajan más de 0,02 respecto a la baseline
      # versionada en tests/modules/agents_hub/evaluation/baselines/.
      - name: Retrieval regression gate (needs PostgreSQL)
        run: |
          uv run pytest \
            tests/modules/agents_hub/evaluation/ \
            -n0 \
            --no-cov \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: server/coverage.xml
          retention-days: 7

  contract:
    name: API Contract (OpenAPI → Orval → TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # `--locked` y no `--frozen`, por lo mismo que en el job de arriba: `--frozen` usa el lock
      # tal cual **sin comprobar que corresponda al manifiesto**, así que este job podía validar el
      # contrato OpenAPI contra un conjunto de dependencias que `pyproject.toml` ya no declara. No
      # reescribía nada —eso es lo que `--frozen` sí garantiza—, pero tampoco avisaba.
      - name: Install backend dependencies (--locked, el lock cuadra con pyproject)
        working-directory: server
        run: uv sync --locked

      - name: Export OpenAPI schema
        working-directory: server
        run: uv run python export_openapi.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate API client
        working-directory: frontend
        run: npm run generate:api

      - name: Upload generated API client
        uses: actions/upload-artifact@v7
        with:
          name: generated-api-client
          path: frontend/src/shared/api/generated/
          retention-days: 1

      - name: TypeScript contract check
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit

      # Issue #47 — el linter del frontend existía y **no lo llamaba ningún trabajo**, o sea que
      # estaba apagado: avisaba sólo a quien se acordara de ejecutarlo en local. El backend sí se
      # lintea (`ruff check app/ tests/`); esto era la mitad que faltaba.
      #
      # Va **en este trabajo y no en otro** porque el cliente de la API lo genera Orval y no
      # viaja en el repositorio: aquí ya está generado dos pasos más arriba. En un trabajo propio
      # habría que repetir la generación entera para linterar.
      #
      # `--max-warnings 33` está en el script, con su razón escrita en `eslint.config.js`: los
      # errores están **en cero** y los 33 avisos son los defectos de hooks que quedan por
      # arreglar. El techo hace que un hallazgo **nuevo** tumbe el job aunque los viejos sigan.
      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm test

  a11y:
    name: Accessibility audit (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    needs: contract

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download generated API client
        uses: actions/download-artifact@v8
        with:
          name: generated-api-client
          path: frontend/src/shared/api/generated/

      - name: Run a11y baseline tests
        working-directory: frontend
        run: npm run test:a11y

  # ---------------------------------------------------------------------------------------
  # Cadena de suministro: vulnerabilidades conocidas, inventario de dependencias y secretos.
  #
  # **Por qué existe, y no es por una exigencia externa todavía.** La OIATI planteó el
  # 2026-09-08 que antes de cada puesta en explotación generalizada haya una auditoría de
  # seguridad independiente, con el modelo del voto electrónico como precedente. Este job no
  # la sustituye: la prepara. Una auditoría sobre un código sin inventario de dependencias
  # gasta sus primeras horas construyendo el inventario, y encuentra CVE de librería —que
  # cualquier herramienta detecta— en vez de lo que sólo encuentra una persona mirando el
  # diseño.
  #
  # El otro motivo es concreto y está medido: el commit huérfano `dc4904e0c763` seguía
  # sirviendo `logs/` con 46 ficheros de datos reales 17 días después de reescribir el
  # historial. Un escáner de secretos no habría evitado aquello —no eran credenciales— pero
  # sí cierra la puerta al caso que sí lo sería.
  #
  # **Qué bloquea y qué informa, que es la decisión de diseño de este job.** Sólo bloquea
  # gitleaks sobre el árbol de trabajo: una credencial en el árbol es inequívoca y se arregla
  # quitándola. Los escáneres de vulnerabilidades **informan y no bloquean**, y no es
  # laxitud: sobre 408 dependencias transitivas aparecerá antes o después un CVE sin versión
  # corregida publicada, y un guardarraíl que se pone rojo por algo que quien lo lee no puede
  # arreglar es un guardarraíl que se desactiva —el mismo razonamiento que está escrito en el
  # paso de `alembic check`—. El camino es el del gate de retrieval: primero medir, y con la
  # medida encima de la mesa, fijar el umbral que sí bloquea.
  #
  # **El historial tampoco bloquea**, y por lo mismo: estaría rojo hasta que alguien
  # reescribiera el pasado, que no es una acción que un check de CI pueda pedir.
  # ---------------------------------------------------------------------------------------
  supply-chain:
    name: Supply chain — vulnerabilities, SBOM and secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # Pinada a propósito y verificada contra la página de releases el 2026-09-08. Subirla es
      # una decisión, no una deriva: una versión que se resuelve sola en cada ejecución es
      # justamente la clase de dependencia que este job existe para vigilar.
      GITLEAKS_VERSION: "8.30.1"

    steps:
      # `fetch-depth: 0` porque el escaneo del historial necesita el historial. Los demás jobs
      # se quedan con el clon superficial que basta para compilar y probar.
      - name: Checkout (full history — el escaneo de secretos lo necesita)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # `--locked` por lo mismo que en los otros dos jobs: sin él `uv export` puede volver a
      # resolver, y auditaríamos un conjunto de dependencias que el lock no describe — que es
      # exactamente el desajuste que vivió 17 días sin dar síntoma.
      #
      # `--no-emit-project` y `--no-emit-package automatia-shared` quitan **nuestro** código
      # del fichero. No es cosmético: `-e ../shared` es una ruta local que pip-audit no puede
      # resolver contra PyPI, y además auditar código propio contra una base de CVE de
      # terceros no dice nada. Sus dependencias sí están, resueltas en el mismo export.
      #
      # Medido en local el 2026-09-08: 408 dependencias en `server`, 38 en `mcp_server`, cero
      # editables en los dos.
      #
      # APER.9 — **son cuatro proyectos con lock, no dos.** Esto exportaba `server` y
      # `mcp_server`, que son justamente los dos que estaban limpios, y dejaba fuera
      # `shared/uv.lock` y `services/script_sandbox/uv.lock`. Lo destapó Dependabot a los trece
      # minutos de activarlo: 30 avisos, ninguno en lo que este job miraba. Y el peor de los dos
      # huecos era el sandbox, porque **su lock se despliega**: es el contenedor que ejecuta los
      # scripts, y llevaba `cryptography` 48.0.0 y `pillow` 12.2.0 (7 y 26 vulnerabilidades
      # conocidas según OSV, de las que la pestaña de GitHub sólo señalaba 2).
      #
      # `shared` es un proyecto propio y su código se excluye igual que el de los otros; lo que
      # se audita son sus dependencias, que es por donde entraban `pillow` y `cryptography`.
      # Que un lock nuevo no pueda volver a quedarse fuera lo fija
      # `test_las_dependencias_auditadas_son_las_del_lock`, que **cuenta los `uv.lock` del árbol**
      # en vez de una cifra escrita a mano.
      - name: Export the locked dependency sets
        run: |
          mkdir -p sbom
          uv export --directory server --locked --no-dev --no-hashes \
            --no-emit-project --no-emit-package automatia-shared \
            --format requirements-txt -o "$GITHUB_WORKSPACE/sbom/server-requirements.txt"
          uv export --directory mcp_server --locked --no-dev --no-hashes \
            --no-emit-project \
            --format requirements-txt -o "$GITHUB_WORKSPACE/sbom/mcp-requirements.txt"
          uv export --directory shared --locked --no-dev --no-hashes \
            --no-emit-project \
            --format requirements-txt -o "$GITHUB_WORKSPACE/sbom/shared-requirements.txt"
          uv export --directory services/script_sandbox --locked --no-dev --no-hashes \
            --no-emit-project \
            --format requirements-txt -o "$GITHUB_WORKSPACE/sbom/sandbox-requirements.txt"

          # APER.17 — y el conjunto COMPLETO del lock: con extras y con `dev`. No se despliega,
          # así que no bloquea; se audita porque es lo que describe el lock y lo que ve
          # Dependabot. Sin esto, el job auditaba 200 paquetes de los 438 de `server` y el verde
          # no decía su alcance: el 2026-09-19 Dependabot informó de un `authlib` crítico
          # mientras este job estaba en verde, y las dos cosas eran ciertas.
          for proyecto in server mcp_server shared services/script_sandbox; do
            nombre="$(echo "$proyecto" | tr '/' '-')"
            # Los paquetes locales se quitan del fichero: `pip-audit` instala lo que lee,
            # y un `-e ./tests/fixtures/...` lo hace fallar entero con «not a valid
            # editable requirement» — medido antes de empujar esto. Auditar código propio
            # contra una base de CVE de terceros tampoco diría nada.
            uv export --directory "$proyecto" --locked --all-extras --no-hashes \
              --no-emit-project --no-emit-package automatia-shared \
              --no-emit-package govgenai-demo-perfil \
              --format requirements-txt \
              -o "$GITHUB_WORKSPACE/sbom/completo-$nombre-requirements.txt"
          done

      # Sin versión pinada, a propósito y al revés que gitleaks: pip-audit consulta la base de
      # avisos viva de PyPI, así que lo que importa es que la herramienta siga al día. De cada
      # ejecución lo que queda registrado es el informe, no la versión del escáner.
      # El `|| rc=1` no es defensivo: arregla un agujero que la primera ejecución destapó. Los
      # dos comandos estaban encadenados sin más, `pip-audit` sale con código 1 cuando encuentra
      # algo, y el shell de GitHub aborta el paso al primer fallo. Como el paso lleva
      # `continue-on-error`, el job siguió en verde y **`mcp_server` no se auditó nunca**: en el
      # artefacto había `pip-audit-server.json` y no había `pip-audit-mcp.json`, que es la única
      # forma en que se notaba. Un paso que informa y se corta a la primera informa de la mitad.
      #
      # El `exit $rc` conserva lo que importa: el `outcome` del paso sigue diciendo la verdad, y
      # es lo que lee la tabla del resumen.
      # Este paso SIGUE sin bloquear, y a propósito: su trabajo es producir los dos informes,
      # no juzgarlos. Quien juzga es el paso siguiente, que lee el fichero de aceptados. Si este
      # paso bloqueara, `pip-audit` tumbaría el job por cualquier aviso —incluidos los que nadie
      # puede arreglar— y volveríamos justo al guardarraíl que se acaba desactivando.
      - name: Python dependency audit (pip-audit — produce los informes)
        id: pip_audit
        continue-on-error: true
        run: |
          rc=0
          uvx pip-audit -r sbom/server-requirements.txt \
            --format json --output sbom/pip-audit-server.json --progress-spinner off || rc=1
          uvx pip-audit -r sbom/mcp-requirements.txt \
            --format json --output sbom/pip-audit-mcp.json --progress-spinner off || rc=1
          uvx pip-audit -r sbom/shared-requirements.txt \
            --format json --output sbom/pip-audit-shared.json --progress-spinner off || rc=1
          uvx pip-audit -r sbom/sandbox-requirements.txt \
            --format json --output sbom/pip-audit-sandbox.json --progress-spinner off || rc=1
          # APER.17 — el conjunto completo NO se audita con `pip-audit`, y la razón se midió:
          # `pip-audit -r` **instala** lo que lee para resolverlo, y estos ficheros llevan
          # `torch` y sus ruedas — más de quince minutos sin producir informe. Aquí no hay nada
          # que resolver (el export viene pinchado a `nombre==versión`), así que se pregunta a
          # OSV por lotes, que es la misma base que `pip-audit` consulta por omisión: 14
          # segundos para 435 paquetes, y los mismos diez hallazgos que reporta Dependabot.
          #
          # La salida imita la de `pip-audit --format json`, así que la puerta la lee igual.
          for proyecto in server mcp_server shared services-script_sandbox; do
            python scripts/avisos_del_lock.py \
              "sbom/completo-$proyecto-requirements.txt" \
              --salida "sbom/pip-audit-completo-$proyecto.json" || rc=1
          done
          exit $rc

      # **BLOQUEA**, y el criterio está escrito entero en el guion y en `avisos_aceptados.toml`:
      # un aviso con corrección publicada y sin aceptar pone rojo el build. Lo que no tiene
      # corrección informa.
      #
      # No es un umbral por severidad, que es lo que el plan proponía, porque **`pip-audit` no
      # informa de severidad**: sus entradas traen `id`, `aliases`, `description` y
      # `fix_versions`, y nada más. Un umbral por CVSS tendría que inventarse el dato o dejar un
      # hueco por el que pasan los avisos sin severidad, y eso no se ve en el verde.
      #
      # `if: always()` porque el paso anterior sale con 1 cuando encuentra algo —que es
      # precisamente cuando este paso hace falta— y `continue-on-error` solo dice «no tumbes el
      # job», no «ejecútalo igualmente». Es la misma lección que costó el escaneo del historial
      # saliendo `skipped` en la primera ejecución.
      - name: Vulnerability gate — Python (BLOCKS)
        if: always()
        run: |
          python scripts/puerta_de_avisos.py \
            sbom/pip-audit-server.json sbom/pip-audit-mcp.json \
            sbom/pip-audit-shared.json sbom/pip-audit-sandbox.json \
            --informativos \
              sbom/pip-audit-completo-server.json \
              sbom/pip-audit-completo-mcp_server.json \
              sbom/pip-audit-completo-shared.json \
              sbom/pip-audit-completo-services-script_sandbox.json \
            --aceptados avisos_aceptados.toml \
            --resumen "$GITHUB_STEP_SUMMARY"

      # A partir de aquí, TODOS los pasos llevan `if: always()`, y la razón la enseñó la primera
      # ejecución de la puerta de DEP.7. Este job tiene ahora tres pasos que bloquean, y en
      # GitHub Actions un paso fallido salta **todo** lo que viene detrás salvo lo marcado con
      # `always()`. Con la puerta en rojo se saltaron `npm audit`, el SBOM y —lo grave— el
      # escaneo de secretos del árbol, que es el paso del que este mismo fichero dice que si
      # deja de ejecutarse «el job entero es decorativo».
      #
      # O sea: encender una puerta había apagado las otras dos. Es la tercera vez que este job
      # se come la misma avería —la primera fue `mcp_server` sin auditar, la segunda el escaneo
      # del historial saliendo `skipped`—, así que ya no se arregla paso a paso sino por regla,
      # con un guardarraíl que la fija: `test_ningun_paso_se_salta_por_un_rojo_anterior`.
      #
      # Las comprobaciones son independientes: que el árbol de Python tenga un aviso no dice
      # nada sobre si hay un secreto en el árbol de trabajo, y enterarse de las dos cosas en la
      # misma ejecución es justo lo que hace útil el job.
      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: always()
        working-directory: frontend
        run: npm ci

      # `--omit=dev` porque una vulnerabilidad en la cadena de construcción no viaja al
      # navegador de nadie. Interesa, pero no es el mismo riesgo, y mezclarlas hace que el
      # número deje de significar algo.
      # **BLOQUEA desde DEP.7**, y aquí sí por severidad: al revés que `pip-audit`, `npm audit`
      # la trae, así que `--audit-level=high` es un umbral real y no una aproximación. Medido el
      # 2026-09-15 antes de encenderlo: el árbol de producción está en **cero** avisos, así que
      # la puerta nace en verde y lo que vigila es la deriva futura.
      #
      # El `tee` conserva el informe pase lo que pase —el artefacto tiene que llevarlo también
      # cuando el paso se pone rojo, que es cuando más falta hace— y `PIPESTATUS` recupera el
      # código de `npm audit`, que sin él quedaría enmascarado por el del `tee`. Sin esas dos
      # líneas, bloquear habría costado perder el informe justo en el caso interesante.
      - name: JS dependency audit (npm audit — BLOCKS on high)
        id: npm_audit
        if: always()
        working-directory: frontend
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json \
            | tee "$GITHUB_WORKSPACE/sbom/npm-audit.json"
          exit "${PIPESTATUS[0]}"

      # El SBOM es lo que se le entrega a quien audite, y la razón de que la retención de este
      # artefacto sea de 90 días y no de 7 como la de cobertura: es evidencia con fecha de qué
      # se estaba ejecutando, y su valor aparece meses después.
      - name: Generate SBOM (CycloneDX)
        if: always()
        continue-on-error: true
        run: |
          uvx --from cyclonedx-bom cyclonedx-py requirements \
            sbom/server-requirements.txt -o sbom/sbom-server.cdx.json
          uvx --from cyclonedx-bom cyclonedx-py requirements \
            sbom/mcp-requirements.txt -o sbom/sbom-mcp.cdx.json
          npx --yes @cyclonedx/cyclonedx-npm --omit dev \
            --output-file "$GITHUB_WORKSPACE/sbom/sbom-frontend.cdx.json" \
            --package-lock-only frontend/package-lock.json

      # La suma se comprueba contra el fichero de sumas de la MISMA release, así que protege de
      # una descarga truncada o alterada en tránsito, no de una release comprometida. Se dice
      # para que nadie lea de aquí una garantía que no da.
      - name: Install gitleaks
        if: always()
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks_checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" gitleaks_checksums.txt \
            | sed "s/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz/gitleaks.tar.gz/" \
            | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # **El único paso que bloquea.** Un secreto en el árbol de trabajo no es un juicio de
      # valor ni depende de que exista parche aguas arriba: se quita y se rota.
      - name: Secret scan — working tree (BLOCKS)
        if: always()
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --report-path sbom/gitleaks-tree.json

      # El historial informa y no bloquea: ponerlo a bloquear dejaría el check rojo hasta que
      # alguien reescribiera el pasado. Lo que sí hace es dejar constancia con fecha de qué hay
      # ahí atrás, que es la mitad del trabajo cuando toca decidir si una fuga sigue viva.
      #
      # **`if: always()` y no sólo `continue-on-error`**, y la diferencia la enseñó la primera
      # ejecución: `continue-on-error` dice «si este paso falla, no tumbes el job», no «ejecuta
      # este paso aunque uno anterior fallara». Con el escaneo del árbol en rojo, éste salió
      # `skipped` — justo el día en que más falta hacía saber qué había en el historial.
      - name: Secret scan — full history (informa, no bloquea)
        if: always()
        continue-on-error: true
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --report-path sbom/gitleaks-history.json

      # Sin esto hay que descargar el artefacto para saber si algo salió mal, y un informe que
      # cuesta tres clics no se mira.
      - name: Summarise
        if: always()
        run: |
          {
            echo "## Cadena de suministro"
            echo ""
            echo "| Comprobación | Resultado |"
            echo "|---|---|"
            echo "| pip-audit (server + mcp, informa) | ${{ steps.pip_audit.outcome }} |"
            echo "| npm audit (frontend, prod — BLOQUEA en high) | ${{ steps.npm_audit.outcome }} |"
            echo ""
            echo "Informes completos y SBOM en el artefacto \`supply-chain\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM and audit reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: supply-chain
          path: sbom/
          retention-days: 90

  # ---------------------------------------------------------------------------------------
  # La imagen que se despliega, construida y ARRANCADA.
  #
  # **Nace de tumbar producción 35 minutos el 2026-09-15**, y lo que hay que recordar no es el
  # paquete sino la clase de agujero: el único conjunto de dependencias que se despliega —el
  # base, `uv sync --frozen --no-dev`, sin extras— era el único que no probaba nadie.
  #
  # | Comprobación                                   | Qué instala        | ¿Vio el fallo? |
  # |------------------------------------------------|--------------------|----------------|
  # | `Lint & Test`                                   | `--all-extras`     | No             |
  # | `test_dep1_no_hay_dependencias_de_rebote.py`    | —                  | No: mira imports, y `uvicorn` se invoca |
  # | Comprobar que la app IMPORTA con el conjunto base | base             | No: importar funcionaba |
  # | `test_dep8_…_ejecutables_del_dockerfile…`       | —                  | Sí, pero sólo el `CMD` |
  # | Construir la imagen y levantarla                | base, como el despliegue | Sí     |
  #
  # Por eso este job **arranca** el contenedor y no se conforma con construirlo: el 15-09 la
  # imagen se construyó perfectamente y el contenedor murió con `executable file not found`.
  #
  # **Las cuatro imágenes se construyen siempre** —construir es barato y caza un `Dockerfile`
  # roto: el del frontend dejó de construir el 2026-09-16 por un `[build-system]` añadido en
  # otro sitio, y se descubrió a mano a un paso del merge— pero **sólo se arranca la de la
  # aplicación**, que es la única con una comprobación de salud que significa algo aquí: el
  # frontend sirve estáticos, el sandbox y el MCP necesitan una red y una configuración que
  # este job no monta.
  #
  # **No publica nada.** Construir para comprobar y publicar para desplegar son cosas
  # distintas; mezclarlas metería en CI permisos de escritura sobre el registro.
  #
  # Lo fija `server/tests/infra/test_img1_ci_construye_y_arranca_la_imagen.py`, que lee de
  # `deploy.yml` qué imágenes y qué `Dockerfile` usa el despliegue en vez de copiarlos aquí.
  # ---------------------------------------------------------------------------------------
  imagen:
    name: Imagen — se construye y arranca
    runs-on: ubuntu-latest
    needs: contract

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: govgenai
          POSTGRES_USER: govgenai
          POSTGRES_PASSWORD: govgenai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govgenai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DSN_ASYNC: postgresql+asyncpg://govgenai:govgenai_ci@localhost:5432/govgenai
      DSN_SYNC: postgresql+psycopg2://govgenai:govgenai_ci@localhost:5432/govgenai

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `frontend/src/shared/api/generated/` está en `.gitignore` a propósito: lo genera Orval
      # desde `openapi.json`, así que **no viaja en el repositorio** y `docker build ./frontend`
      # a secas falla con veinte «Cannot find module '@/shared/api/generated/...'». El primer
      # despliegue murió exactamente ahí. Se descarga del job `contract`, que ya lo generó, en
      # vez de repetir aquí la instalación del backend y de node: es la misma secuencia y
      # duplicarla es cómo empiezan a divergir.
      - name: Descargar el cliente de la API generado
        uses: actions/download-artifact@v8
        with:
          name: generated-api-client
          path: frontend/src/shared/api/generated/

      - name: Construir las cuatro imágenes con los Dockerfile del despliegue
        run: |
          set -euo pipefail
          docker build -t govgenai/app:ci      -f Dockerfile .
          docker build -t govgenai/frontend:ci -f frontend/Dockerfile frontend
          docker build -t govgenai/sandbox:ci  -f services/script_sandbox/Dockerfile services/script_sandbox
          docker build -t govgenai/mcp:ci      -f mcp_server/Dockerfile mcp_server

      # El arranque consulta la base —trabajos zombis y sembrado— así que sin migrar, el
      # contenedor moriría por una razón distinta de la que este job vigila. Lo hace la MISMA
      # imagen, igual que el servicio `migrate` de `docker-compose.prod.yml`.
      - name: Aplicar las migraciones con la imagen recién construida
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e DATABASE_URL="$DSN_ASYNC" \
            -e DATABASE_URL_SYNC="$DSN_SYNC" \
            -w /app/server \
            govgenai/app:ci alembic upgrade head

      # `ENVIRONMENT=production` a propósito: es el entorno que se despliega, y el que activa
      # los tres gates de `core/config.py` —secreto real, sandbox no local, sin `TESTING`—. Con
      # `development` este job comprobaría que arranca algo que no es lo que se sirve.
      #
      # El criterio de «sirve» es el del paso «Comprobar que sirve, y volver atrás si no» de
      # `deploy.yml`: `/health` en 200, con reintentos. Dos definiciones acabarían divergiendo.
      - name: Arrancar la imagen y esperar a que sirva
        run: |
          set -euo pipefail
          docker run -d --name govgenai_ci_app --network host \
            -e DATABASE_URL="$DSN_ASYNC" \
            -e DATABASE_URL_SYNC="$DSN_SYNC" \
            -e JWT_SECRET_KEY=ci-imagen-secreto-que-no-firma-nada-real-32 \
            -e ENVIRONMENT=production \
            -e LOG_LEVEL=INFO \
            govgenai/app:ci

          # Tres minutos de margen, y no por prudencia genérica: el arranque refresca la caché
          # de modelos y los precios contra dos APIs externas **antes** de servir, y esas
          # llamadas no llevan `timeout` propio (el de aiohttp por omisión son 5 minutos). Con
          # la red del runner lenta o cortada, un margen corto pondría este job rojo por prisa
          # y no por avería, que es la peor forma de gastar un guardarraíl.
          ok=0
          for intento in $(seq 1 30); do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)"
            if [ "$codigo" = "200" ]; then ok=1; break; fi
            echo "intento $intento: /health devolvió ${codigo:-sin respuesta}"
            sleep 6
          done

          if [ "$ok" != "1" ]; then
            echo "::error::La imagen se construyó pero el contenedor no llegó a servir /health"
            docker logs govgenai_ci_app
            exit 1
          fi
          echo "/health responde 200 desde la imagen que se despliega"

      # Issue #44 — y esto hay que EJECUTARLO. Que el `Dockerfile` diga
      # `nginxinc/nginx-unprivileged` comprueba la intención; como qué usuario acaba corriendo
      # el proceso depende también de la imagen base y de si algo la sobreescribe, y eso sólo
      # lo dice el contenedor en marcha. La imagen ya está construida en el paso de arriba, así
      # que esto cuesta segundos.
      #
      # Se comprueban las dos cosas que la issue pide: que no sea root y que siga sirviendo.
      - name: El frontend arranca sin privilegios y sirve
        run: |
          set -euo pipefail
          # `--add-host app:127.0.0.1` no es un apaño: **sin él el contenedor no arranca**, y
          # eso es de siempre, no del cambio de imagen. nginx resuelve los `upstream` al cargar
          # la configuración, y `nginx.conf` reenvía `/api/` a `app`; si ese nombre no existe,
          # muere con `host not found in upstream "app"`. En el despliegue lo resuelve la red
          # del compose. Aquí basta con que el nombre resuelva: lo que se comprueba es el
          # usuario y que los estáticos se sirvan, no el reenvío, que necesitaría el backend.
          docker run -d --name govgenai_ci_frontend --add-host app:127.0.0.1             -p 8080:8080 govgenai/frontend:ci

          quien="$(docker exec govgenai_ci_frontend id || true)"
          echo "el contenedor del frontend corre como: $quien"
          case "$quien" in
            *uid=0*)
              echo "::error::El frontend corre como root dentro del contenedor ($quien)"
              docker logs govgenai_ci_frontend
              exit 1
              ;;
            uid=*) ;;
            *)
              echo "::error::No se ha podido leer el usuario del contenedor: «$quien»"
              docker logs govgenai_ci_frontend
              exit 1
              ;;
          esac

          ok=0
          for intento in $(seq 1 15); do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)"
            if [ "$codigo" = "200" ]; then ok=1; break; fi
            echo "intento $intento: /healthz devolvió ${codigo:-sin respuesta}"
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::El frontend no llegó a servir /healthz en el 8080"
            docker logs govgenai_ci_frontend
            exit 1
          fi

          # Y que el panel se sirve de verdad, no sólo la sonda: `/panel/` tiene que devolver
          # el `index.html`, que es lo que rompería un cambio de puerto a medias.
          codigo="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/panel/ || true)"
          if [ "$codigo" != "200" ]; then
            echo "::error::/panel/ devolvió $codigo en vez de 200"
            docker logs govgenai_ci_frontend
            exit 1
          fi
          echo "frontend sin privilegios, /healthz y /panel/ a 200"

      - name: Retirar el contenedor del frontend
        if: always()
        run: docker rm -f govgenai_ci_frontend || true

      # Issue #91 — las otras dos imágenes se construían y no se arrancaban, así que su verde
      # decía «compila» y no «arranca». Es la forma exacta del incidente del 2026-09-15:
      # `uvicorn` no estaba declarado, la imagen construía y `docker run` daba `rc=127`.
      - name: El sandbox arranca y sirve
        run: |
          set -euo pipefail
          docker run -d --name govgenai_ci_sandbox -p 5000:5000 govgenai/sandbox:ci

          ok=0
          for intento in $(seq 1 15); do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/health || true)"
            if [ "$codigo" = "200" ]; then ok=1; break; fi
            echo "intento $intento: /health devolvió ${codigo:-sin respuesta}"
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::El sandbox no llegó a servir /health en el 5000"
            docker logs govgenai_ci_sandbox
            exit 1
          fi
          echo "sandbox arrancado, /health a 200"

      - name: Retirar el contenedor del sandbox
        if: always()
        run: docker rm -f govgenai_ci_sandbox || true

      # **Aquí no se espera un 200, y hay que leerlo antes de "arreglarlo".**
      #
      # La respuesta sana del MCP no es un 200: un `GET /mcp` sin la cabecera del transporte
      # devuelve **406**, y desde un host que no esté en `GOVGENAI_MCP_ALLOWED_HOSTS` devuelve
      # **421**. Las dos significan «en pie»; lo que significa «muerto» es **no responder**.
      # Un paso que exigiera 200 se pondría rojo con el servicio sano.
      #
      # Y es `--factory`: la aplicación se construye **al arrancar**, no al importar, así que un
      # fallo de construcción sólo se ve con el proceso en marcha. Por eso este paso vale y
      # comprobar la imagen construida no.
      - name: El MCP arranca y responde
        run: |
          set -euo pipefail
          docker run -d --name govgenai_ci_mcp -p 8081:8080 \
            -e GOVGENAI_API_BASE_URL=http://localhost:8000 \
            -e GOVGENAI_MCP_ALLOWED_HOSTS=localhost:8081 \
            govgenai/mcp:ci

          ok=0
          for intento in $(seq 1 15); do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/mcp || true)"
            case "$codigo" in
              "" | 000) echo "intento $intento: sin respuesta" ;;
              *) echo "el MCP responde con $codigo: está en pie"; ok=1 ;;
            esac
            [ "$ok" = "1" ] && break
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::El MCP no llegó a responder en el 8080"
            docker logs govgenai_ci_mcp
            exit 1
          fi

          # Y que la sonda del propio `Dockerfile` diga que está sano, que es la que decide en
          # producción. Comprobar la ruta a mano y no la sonda dejaría la sonda sin probar.
          for intento in $(seq 1 20); do
            salud="$(docker inspect -f '{{.State.Health.Status}}' govgenai_ci_mcp 2>/dev/null || echo sin-sonda)"
            [ "$salud" = "healthy" ] && break
            echo "intento $intento: la sonda dice «$salud»"
            sleep 3
          done
          if [ "$salud" != "healthy" ]; then
            echo "::error::El HEALTHCHECK del MCP no llega a «healthy» (dice «$salud»)"
            docker logs govgenai_ci_mcp
            exit 1
          fi
          echo "MCP en pie y su HEALTHCHECK en healthy"

      - name: Retirar el contenedor del MCP
        if: always()
        run: docker rm -f govgenai_ci_mcp || true

      # Cuánto ha costado, escrito donde se lee sin descargar nada. La decisión de dónde corre
      # este job se toma con esta medida delante, no antes de tenerla.
      - name: Resumen
        if: always()
        run: |
          {
            echo "## Imagen"
            echo ""
            echo "**Las cuatro imágenes construidas Y arrancadas** con los \`Dockerfile\` del"
            echo "despliegue (issue #91; antes se arrancaban dos y el resumen decía «las"
            echo "cuatro», que se leía como «las cuatro comprobadas»):"
            echo ""
            echo "- \`app\`: migrada y arrancada hasta \`/health\` 200."
            echo "- \`frontend\`: arrancada sin privilegios hasta \`/panel/\` 200."
            echo "- \`sandbox\`: arrancada hasta \`/health\` 200."
            echo "- \`mcp\`: arrancada hasta responder —406 o 421 son \"en pie\"; lo que"
            echo "  significa \"muerto\" es no responder— y con su \`HEALTHCHECK\` en healthy."
          } >> "$GITHUB_STEP_SUMMARY"

  # Una issue arreglada se cierra al llegar a producción, y no cuando alguien se acuerda.
  #
  # **De dónde sale.** El 2026-09-23, con el repositorio a punto de abrirse, había **once issues
  # abiertas cuyo arreglo ya estaba en `main` y desplegado** — entre ellas «el comando de arranque
  # del README no arranca», que es de lo primero que lee quien llega. La lista de issues anunciaba
  # defectos resueltos.
  #
  # La causa no fue despiste: los commits escribían `fix(#92):` en el asunto, y eso **GitHub no lo
  # trata como palabra de cierre**. Sólo `Closes`/`Fixes`/`Resolves #N` cierran, y sólo al llegar a
  # la rama por omisión. Con la palabra puesta, la mezcla a `main` las cierra sola: el momento
  # exacto en que el arreglo existe para quien lo sufría.
  #
  # Sólo en PR **hacia `main`**, que es esa mezcla. En una PR contra `desarrollo` no aplica: ahí el
  # arreglo todavía no está en producción.
  issues-cerradas:
    name: Las issues que se arreglan se cierran
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cada issue que esta PR arregla se cerrará al mezclar
        env:
          GH_TOKEN: ${{ github.token }}
          CUERPO: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Los mensajes de los commits que esta PR trae, más el cuerpo de la PR: GitHub acepta
          # la palabra de cierre en cualquiera de los dos.
          MENSAJES="$(git log --format='%B' origin/${{ github.base_ref }}..HEAD)"
          TODO="$MENSAJES
          $CUERPO"

          # Lo que se lee como «esta PR arregla la issue N»: el prefijo Conventional con la issue
          # entre paréntesis, que es como este repositorio los escribe.
          ARREGLADAS="$(printf '%s' "$MENSAJES" \
            | grep -oiE '^(feat|fix|perf|refactor)\(#[0-9]+\)' \
            | grep -oE '[0-9]+' | sort -u || true)"

          # Y lo que de verdad cierra: las palabras que GitHub entiende.
          CIERRAN="$(printf '%s' "$TODO" \
            | grep -oiE '(clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed))[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)"

          # Y lo que se declara **avance sin cierre**, que es un caso normal y que la primera
          # versión de esta puerta no sabía expresar: un commit `feat(#14)` que entrega el
          # detector pero no lo ejecuta **avanza** la issue y no la termina. Sin esta vía, la
          # única forma de poner la puerta en verde era cerrar una issue sin terminarla o
          # reescribir el asunto del commit — o sea, mentir o rehacer el historial.
          #
          # Silencio sigue siendo rojo. Lo que se exige es que se diga una de las dos cosas.
          PARCIALES="$(printf '%s' "$TODO" \
            | grep -oiE '(parte de|avanza|refs?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)"

          echo "referenciadas como arregladas: ${ARREGLADAS:-ninguna}"
          echo "con palabra de cierre:         ${CIERRAN:-ninguna}"
          echo "declaradas como avance:        ${PARCIALES:-ninguna}"

          FALTAN=""
          for n in $ARREGLADAS; do
            # Una issue ya cerrada no necesita palabra: se cerró a mano o en otra PR.
            estado="$(gh issue view "$n" --json state --jq .state 2>/dev/null || echo DESCONOCIDA)"
            if [ "$estado" = "CLOSED" ] || [ "$estado" = "DESCONOCIDA" ]; then continue; fi
            printf '%s\n' "$PARCIALES" | grep -qx "$n" && continue
            printf '%s\n' "$CIERRAN" | grep -qx "$n" || FALTAN="$FALTAN #$n"
          done

          if [ -n "$FALTAN" ]; then
            echo "::error::Esta PR arregla$FALTAN y esas issues NO se cerrarán al mezclar."
            echo ""
            echo "Un asunto \`fix(#N):\` no es palabra de cierre para GitHub. Hay dos salidas, y"
            echo "las dos consisten en decir qué pasa con la issue:"
            echo "  · \`Closes #N\` en el cuerpo del commit o de la PR, si queda terminada."
            echo "  · \`Parte de #N\` si esto la avanza pero no la cierra."
            echo "Quedarse callado no es una opción: es como se acumulan issues resueltas y"
            echo "abiertas, que es lo que esta puerta vino a evitar."
            exit 1
          fi
          echo "todas las issues que esta PR arregla se cerrarán al mezclar"
