# Actualizaciones de dependencias (APER.6)
#
# Hallazgo B4 de la auditoría previa a abrir el repositorio: no había nada que avisara de una
# dependencia vulnerable. Las dos que APER.4 y la auditoría encontraron —`js-yaml` por `orval` y
# `@vitest/mocker` por `vitest`— llevaban meses ahí, y nadie las vio hasta que alguien miró a mano.
#
# ──────────────────────────────────────────────────────────────────────────────────────────────
# DOS COSAS QUE HAY QUE SABER ANTES DE TOCAR ESTE FICHERO
#
# 1. `target-branch: desarrollo` NO es cosmético. `deploy.yml` dispara con
#    `push: branches: [main]` y sólo con eso, así que una PR de actualización contra `main`
#    **despliega producción al mezclarse**. Contra `desarrollo` se comprueba y no se despliega,
#    que es la regla del proyecto desde el 2026-09-02.
#
#    Ojo con la consecuencia: `target-branch` gobierna las actualizaciones **de versión**, que
#    son las que configura este fichero. Las de **seguridad** —activadas el 2026-09-18— las abre
#    GitHub contra la rama por omisión del repositorio, que es `main`. Eso **no contradice** la
#    regla: abrir la PR no hace nada, y mezclarla a `main` *es* la decisión de despliegue que la
#    regla reserva a una persona. CI corre también en esas PR, así que tampoco entran sin
#    comprobar. Lo que sí hay que hacer, y es mantenimiento y no riesgo: una PR así mezclada
#    aterriza en `main` **sin haber pasado por `desarrollo`**, y las dos ramas divergen hasta que
#    ese commit vuelve a `desarrollo`. Devuélvelo el mismo día, o el siguiente bloque arrancará
#    sobre una base distinta de la que está desplegada.
#
# 2. **Un bump de `pyproject.toml` sin `uv lock` deja CI rojo.** Los dos pasos de instalación
#    usan `uv sync --locked`, que falla si el lock no corresponde a su manifiesto. Dependabot
#    actualiza el lock en el mismo commit, pero eso hay que comprobarlo en la primera PR de cada
#    proyecto: si llega un manifiesto sin su lock, la PR no se mezcla, se completa.
#
# Los grupos están para que esto no llegue como veinte PR sueltas: una por ecosistema y semana,
# que es revisable. **Y agrupan sólo `minor` y `patch`, a propósito.** La primera tanda se
# configuró sin ese límite y produjo una PR con **33 paquetes a la vez**, seis saltos de versión
# mayor y —lo que no se ve en un muro de changelogs— **dos rebajas**: `browser-use` de 0.11.3 a
# 0.5.5 teniendo 0.13.10 disponible, y `ragas` de 0.4.3 a 0.3.1 cuando 0.4.3 es la última. No
# eran actualizaciones: era el precio de resolver 33 cosas juntas, y el resolutor sacrificó esas
# dos para encajar el resto. Un lote así no se puede revisar ni mezclar por partes.
#
# Con el límite puesto, cada salto mayor llega en su propia PR y se juzga solo, que es la única
# forma de decidir sobre un `openai` 2→3 o un `pandas` 2→3. Los ecosistemas y las rutas los comprueba
# `server/tests/infra/test_aper6_dependabot_vigila_lo_que_existe.py`; lo que **no** puede
# comprobar un test local es que GitHub acepte los nombres de ecosistema, así que tras el primer
# push hay que mirar la pestaña Dependabot del repositorio — una configuración inválida no hace
# nada y no avisa, que es la peor forma de fallar.
# ──────────────────────────────────────────────────────────────────────────────────────────────

#
# ─── CADENCIA: MENSUAL, y por que se bajo de semanal (2026-09-22) ─────────────────────────────
#
# Semanal tenia sentido mientras se recuperaban cuatro meses de atraso. Pasado eso, semanal por
# siete ecosistemas es una cola que no se vacia nunca, y una lista que no se vacia se acaba
# aprobando en bloque — que es justo lo que estos grupos venian a evitar.
#
# **Esto NO toca las actualizaciones de seguridad.** Son otro canal: las abre GitHub contra la
# rama por omision en cuanto hay aviso, y siguen siendo inmediatas. Son dos relojes para dos
# urgencias distintas, y confundirlos seria retrasar un arreglo de seguridad un mes.
#
# La cadencia de las *releases* NO esta comprometida: el proyecto es experimental y no promete
# ni soporte ni fechas (README, «Que no acompana a la publicacion»). Se etiqueta por
# acontecimiento. Ver `docs/VERSIONADO.md`.

version: 2

updates:
  # ─── Python, los cuatro proyectos con uv ───────────────────────────────────────────────────
  - package-ecosystem: uv
    directory: /server
    target-branch: desarrollo
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      servidor:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    # Aquí estuvo una exclusión de `setuptools`, puesta «sólo para que no llegue la misma PR cada
    # semana» mientras el techo `setuptools<82` de `torch` 2.11 hacía inaplicable la corrección.
    # **APER.20 la retiró** al subir torch a 2.14, que ya no pone techo: ahora esa PR sí se puede
    # aplicar, así que silenciarla sería perder el aviso en vez de ahorrarse ruido.

  - package-ecosystem: uv
    directory: /mcp_server
    target-branch: desarrollo
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      mcp:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: /services/script_sandbox
    target-branch: desarrollo
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      sandbox:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"


  # ─── El frontend ───────────────────────────────────────────────────────────────────────────
  #
  # Separado en dos grupos a propósito: lo que se sirve al navegador y lo que sólo compila o
  # prueba. Los cinco avisos de la auditoría eran todos de herramientas de desarrollo, y leerlos
  # mezclados con un bump de React haría que se revisaran igual de rápido, que es lo que sobra.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: desarrollo
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      lo-que-se-sirve:
        update-types: ["minor", "patch"]
        dependency-type: production
        patterns: ["*"]
      herramientas:
        update-types: ["minor", "patch"]
        dependency-type: development
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # `typescript` 7.0.x, y **sólo** la 7.0.x.
      #
      # La 7 es el port nativo, y sobre el compilador no hay nada que objetar: con la 7.0.2
      # instalada `tsc` pasa limpio en los dos tsconfig, `tsc -b` construye, `vite build` genera
      # el paquete y la suite entera pasa. **Lo que muere es `eslint`**: ocho paquetes de
      # `typescript-eslint` declaran `typescript >=4.8.4 <6.1.0` como par obligatorio y la 8.70.0
      # —la última estable, no hay una 9— sigue en ese rango. Arranca y se cae con
      # «typescript-eslint does not support TS 7.0».
      #
      # Y no se vería: `npm install` sólo avisa (`ERESOLVE overriding peer dependency`) y
      # devuelve 0, y aquí **ESLint no corre en CI** todavía (issue #47). La subida entraría en
      # verde dejando el linter inservible.
      #
      # Se acota a `7.0.x` a propósito, y no a la mayor entera: el issue de seguimiento de
      # typescript-eslint (typescript-eslint#10940) apunta a **TS >=7.1**, así que cuando llegue
      # la 7.1 queremos que Dependabot la proponga.
      #
      # **Cómo se retira**: cuando `typescript-eslint` publique una estable cuyo par de
      # `typescript` admita la 7. Se comprueba con
      # `npm view typescript-eslint peerDependencies.typescript`. Lo vigila
      # `frontend/src/__tests__/paresObligatoriosSeCumplen.test.ts`, que pondría rojo el lock si
      # la subida entrara sin que el par se cumpla.
      - dependency-name: typescript
        versions: ["7.0.x"]

  # ─── Las acciones de los workflows ─────────────────────────────────────────────────────────
  #
  # Con el repositorio público esto deja de ser higiene y pasa a ser superficie: una acción de
  # tercero corre con el `GITHUB_TOKEN` del repositorio.
  - package-ecosystem: github-actions
    directory: /
    target-branch: desarrollo
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      acciones:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # ─── Las imágenes base ─────────────────────────────────────────────────────────────────────
  #
  # Una por Dockerfile: Dependabot mira la instrucción `FROM`, no el compose. Las etiquetas
  # `:latest` de `docker-compose.prod.yml` quedan fuera de aquí a propósito; eso es el hallazgo
  # B5 y se arregla fijando versiones, no vigilando un `latest` que por definición se mueve.
  # Los compose fijan sus propias imágenes (Postgres, Langfuse, SeaweedFS, Caddy) y el ecosistema
  # `docker` sólo lee los Dockerfile (#268).
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/vm
    target-branch: desarrollo
    schedule:
      interval: monthly
    open-pull-requests-limit: 4
    groups:
      imagenes-compose:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker
    directories:
      - /
      - /frontend
      - /mcp_server
      - /services/script_sandbox
    target-branch: desarrollo
    schedule:
      interval: monthly
    open-pull-requests-limit: 4
    groups:
      imagenes-base:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
