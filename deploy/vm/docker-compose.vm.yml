# docker-compose.vm.yml — la pila que corre en la VM de GCP (D.4-VM).
#
# **Por qué no se reutiliza `docker-compose.prod.yml`.** Ese fichero es la opción
# *autoinstalable*: su propia cabecera lo dice, y trae **su** Postgres, **su** MinIO y un perfil
# de Ollama, con el `DATABASE_URL` del servicio `app` apuntando al contenedor `postgres`. En GCP
# el estado va fuera —Cloud SQL y GCS—, así que levantar ese fichero aquí significaría correr una
# base de datos que nadie usa y otra que sí, con el mismo nombre de variable. El bloque Deploy
# decía que en una VM esto era «prácticamente `docker compose up -d`»; no lo era.
#
# Lo que SÍ se comparte es el `Dockerfile` y la imagen: la construye CI y se publica en Artifact
# Registry etiquetada con el SHA del commit (D.5-VM). Aquí sólo se despliega.
#
# La configuración entra por `/opt/govgenai/.env.runtime`, que escribe
# `scripts/vm_fetch_secrets.sh` desde Secret Manager (D.2). No hay ningún `.env` en la máquina
# mantenido a mano.

# ---------------------------------------------------------------------------------------------
# LA MEMORIA SE SOBREASIGNA A PROPOSITO (2026-09-25)
#
# Hasta hoy los techos se repartian como si fueran cuotas: sumaban 1.264M de los 1.976M de una
# `e2-small` y sobraba casi la mitad sin que nadie pudiera usarla. Eso confunde dos cosas:
#
#   * `limits.memory` es un **techo por contenedor**, no una reserva. Docker no aparta nada: solo
#     mata al contenedor que lo supere. Repartir la RAM entre techos deja memoria ociosa que
#     ningun proceso puede tocar ni en su pico.
#   * `reservations.memory` **si** es lo que el contenedor espera usar. Compose lo aplica tambien
#     fuera de Swarm —comprobado en la VM: `limits: 300M` / `reservations: 100M` llegan al
#     contenedor como `Memory=314572800` y `MemoryReservation=104857600`—, y el kernel lo usa
#     para decidir a quien aprieta cuando hay presion.
#
# De ahi las dos reglas, y la asimetria entre ellas es el punto:
#
#   1. **La suma de las RESERVAS tiene que caber.** Son 976M de 3.924M: lo que la pila usa de
#      verdad en reposo son 511M medidos, asi que hay margen para el crecimiento normal.
#   2. **La suma de los TECHOS no cabe, y esta bien.** Son 3.616M. Cada techo dimensiona el pico
#      *de ese* proceso, no su parte del total, porque los picos no son concurrentes: `migrate`
#      corre una vez al desplegar y termina; el pico de `app` es la reingesta del corpus, que es
#      manual; el de `script-sandbox` solo existe mientras alguien ejecuta un guion.
#
# **Que se rompe si la sobreasignacion se pasa de la raya.** Cuando varios llegan al pico a la
# vez, el que mata ya no es el cgroup del contenedor sino el OOM del kernel, y ese elige a su
# criterio: se cambia un fallo acotado y atribuible por uno global e impredecible. Es lo que paso
# el 2026-09-24.
#
# Por eso el peor caso concurrente **no se cuenta aqui, se comprueba**: `app` en su pico (la
# reingesta, que es manual) mas `script-sandbox` en el suyo (un guion pesado) mas el resto en su
# reserva. Lo vigila `test_el_peor_caso_concurrente_cabe`, y existe porque la primera version de
# este bloque traia la suma mal hecha —se pasaba por 56 MiB— y nadie lo habria notado: un
# comentario con una cuenta envejece en silencio en cuanto alguien sube un techo.
#
# Y la RAM de la maquina **tampoco se escribe aqui**: sale de `scripts/gcp_provision_vm.sh`, que
# es quien la crea. Durante unas horas este fichero dio por hecha una `e2-medium` mientras el
# aprovisionador seguia creando una `e2-small`; los dos guardarrailes pasaban en verde porque
# miraban ficheros distintos.
# ---------------------------------------------------------------------------------------------

name: govgenai-vm

x-imagen: &imagen
  image: ${GOVGENAI_IMAGE:?falta GOVGENAI_IMAGE (repositorio:etiqueta de Artifact Registry)}

services:
  # ---------------------------------------------------------------------------
  # Cloud SQL Auth Proxy: la base NO tiene IP pública abierta y nadie guarda una
  # contraseña de red. El proxy autentica con la cuenta de servicio de la VM y expone
  # un socket Unix, que es la forma que espera `DATABASE_URL` (`?host=/cloudsql/...`).
  # ---------------------------------------------------------------------------
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
    container_name: govgenai_sql_proxy
    command:
      - "--unix-socket=/cloudsql"
      - "--health-check"
      - "--http-address=0.0.0.0"
      - "--http-port=9801"
      - "${CLOUDSQL_CONNECTION_NAME:?falta CLOUDSQL_CONNECTION_NAME}"
    # Directorio del anfitrión y NO un volumen con nombre: la imagen del proxy corre con
    # uid 65532 y un volumen nuevo nace de root con 0755, así que el proxy no puede crear
    # dentro el socket y muere con «Unable to mount socket: mkdir /cloudsql/…: permission
    # denied» — reintentando en bucle, que es como se declara «unhealthy» y tumba a quien
    # depende de él. El quinto despliegue real murió exactamente ahí. El directorio lo crea
    # el arranque con ese dueño.
    volumes:
      - /opt/govgenai/cloudsql:/cloudsql
    healthcheck:
      test: ["CMD", "/cloud-sql-proxy", "wait", "--max=10s", "--http-port=9801"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Issue #149 — 12 MiB medidos. Proceso pequeno y estable: abre el tunel y poco mas.
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 32M
    restart: unless-stopped

  app:
    <<: *imagen
    container_name: govgenai_app
    env_file:
      - /opt/govgenai/.env.runtime
    environment:
      ENVIRONMENT: production
      DEPLOY_MODE: ${DEPLOY_MODE:-all}
      # De quién se fía uvicorn para leer `X-Forwarded-Proto` (issue #99).
      #
      # Su defecto es `127.0.0.1`, y **Caddy conecta desde la red de Docker**, así que la
      # cabecera llegaba y no se honraba: toda URL deducida de la petición salía con `http://`
      # aunque el cliente hubiera entrado por `https://`. Ya mordió una vez —el `redirect_uri`
      # del login con Google— y el siguiente en morder sería el SAML, que reconstruye la URL
      # actual para validar el `Destination` y el `Recipient` de la aserción.
      #
      # **Acotado a la red del proxy, y sólo a ella.** La primera versión ponía `172.16.0.0/12`
      # —el pool privado entero— con el argumento de que a uvicorn no se llega desde fuera
      # porque `app` no publica puertos. Era cierto y **estaba incompleto**: no hace falta llegar
      # desde fuera si ya hay un contenedor hostil dentro. `app` está en **las dos** redes, y en
      # `sandbox-net` corre `script-sandbox`, que ejecuta código de usuario no confiable: desde
      # ahí se alcanza `app:8000` con una dirección que aquel `/12` daba por buena, y con ella se
      # podían falsificar las cabeceras del proxy. Lo señaló la revisión de la PR #110.
      #
      # Ahora es la subred de `default`, donde vive Caddy y no vive el sandbox. Nunca `*`: con
      # `*` cualquier cliente decide el esquema que la aplicación cree estar sirviendo.
      FORWARDED_ALLOW_IPS: 172.28.0.0/24
      # El estado va fuera de la máquina, a propósito: el disco de la VM no guarda nada
      # que duela perder.
      STORAGE_BACKEND: gcs
      STORAGE_BUCKET: ${STORAGE_BUCKET:?falta STORAGE_BUCKET}
      # SEC.8.4 — hay un proxy inverso delante, así que la IP del cliente se cuenta un salto
      # desde la derecha. Con 0 se ignoraría la cabecera y todo el tráfico compartiría cubo.
      TRUSTED_PROXY_HOPS: "1"
      # SEC.8.3 — el arranque falla a propósito si esto fuera `local`.
      SANDBOX_MODE: http
      SANDBOX_BASE_URL: http://script-sandbox:5000
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?falta GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-europe-southwest1}
      CORPUS_SITE_BASE_URL: ${CORPUS_SITE_BASE_URL:?falta CORPUS_SITE_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?falta CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # El enlace al fuente que exige el §13 de la AGPL (AIS.6, issue #41). **Sin tope de
      # obligatoriedad a propósito**: vacía significa «sin enlace», que es lo correcto para
      # quien despliega el código sin modificar. Quien sí lo modifica tiene que poder
      # ponerla, y hasta la issue #41 no había por dónde: la configuración no secreta entra
      # por aquí, y el `.env.runtime` sólo lleva lo que hay en `secretos.tsv`.
      SOURCE_URL: ${SOURCE_URL:-}
      # Login con la cuenta institucional de Google (issue #95). **El identificador y el secreto
      # NO están aquí**: ésos son credenciales y entran por `.env.runtime` desde `secretos.tsv`.
      # Estas dos son configuración no secreta y por eso van por esta lista.
      #
      # Vacías a propósito por omisión: sin las cuatro piezas el login se apaga entero y la ruta
      # responde 404. Un login a medio configurar es peor que ninguno.
      GOOGLE_OAUTH_ALLOWED_DOMAIN: ${GOOGLE_OAUTH_ALLOWED_DOMAIN:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      # Adónde vuelve el navegador tras entrar, con el token en el *fragment* (issue #195). Sin
      # ella el callback devuelve la sesión como JSON y el usuario se queda mirando su token. La
      # comparten Google y el ACS de SAML. En despliegue lleva el prefijo del panel (DOM.2):
      # https://<dominio>/panel/auth/callback.
      SAML_FRONTEND_RETURN_URL: ${SAML_FRONTEND_RETURN_URL:-}
      # La organización en la que queda quien entra con la cuenta institucional, por Google o
      # por SAML: el alta automática es la misma. Sin ella, la persona entra sin organización y
      # no ve nada acotado por organización, como el catálogo de agentes (2026-10-06).
      SAML_ORGANIZACION_ID: ${SAML_ORGANIZACION_ID:-}
      # El plazo de la revisión posterior lo fija la institución que despliega (AUT.12, issue
      # #201). Vacía, vale el de por defecto: 30 días naturales.
      PLAZO_REVISION_POSTERIOR_DIAS: ${PLAZO_REVISION_POSTERIOR_DIAS:-}
      # Días que puede pasar el guion de un agente sin mandar su índice antes de avisar (#174).
      # Vacía, vale el de por defecto: 3.
      INDICE_SIN_ACTUALIZAR_DIAS: ${INDICE_SIN_ACTUALIZAR_DIAS:-}
      # Las extensiones del navegador a las que se entrega el token de consulta (#176). Vacía,
      # no se conecta ninguna.
      AGENTES_EXTENSION_IDS: ${AGENTES_EXTENSION_IDS:-}
    volumes:
      - /opt/govgenai/cloudsql:/cloudsql:ro
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
      script-sandbox:
        condition: service_healthy
    networks:
      - default
      - sandbox-net
    # Issue #149 — 332 MiB medidos. Es el que mas crece —ingesta, extraccion de PDF, informes— y
    # el que se llevo la maquina el 2026-09-24. Si la ingesta alcanza el techo, lo correcto es
    # que muera el contenedor y se vea, no que se ahogue la VM.
    #
    # **Estuvo en 448M durante una hora y era demasiado poco.** Los 332 MiB que se midieron para
    # dimensionarlo eran EN REPOSO; una consulta real del chat añade mas de 130 y el contenedor
    # murio por OOM dos veces en dos minutos, dejando el chat colgado en «Preparando la consulta».
    # La leccion es del metodo, no del numero: **medir en reposo no dimensiona nada**. Lo que hay
    # que medir es el pico bajo la carga que el servicio atiende de verdad.
    #
    # **Y 768M tampoco bastaban para reingerir** (2026-09-25). El cargador del corpus confirma una
    # transaccion por asistente, asi que retiene en memoria todo lo que va a escribir: la norma
    # MAS PEQUENA —198 fragmentos— llego a 475 MiB, y la Ley 9/2017 —4.330 fragmentos— murio con
    # exit 137. Un documento es la unidad minima de carga, o sea que no se puede trocear mas.
    #
    # El techo son 2048M: CUATRO VECES el pico real de la reingesta, que fueron 475 MiB medidos.
    # Estuvo un rato en 2560M y la revision de la PR #166 hizo la resta que yo no habia hecho: el
    # peor caso concurrente —reingesta 2.560 + un guion pesado 512 + el resto en su reserva 208—
    # daba 3.280 MiB contra los 3.224 utiles, o sea que el caso documentado como seguro se pasaba
    # por 56. Ahora la cuenta esta comprobada por `test_el_peor_caso_concurrente_cabe`, que es
    # donde tiene que vivir: un comentario con una suma envejece sin avisar.
    #
    # Si aun asi no cabe, muere el contenedor efimero de la reingesta —acotado y visible— y no la
    # VM entera, que es justo lo que paso el 2026-09-24.
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Migraciones. Bajo perfil, así que `up -d` NO las ejecuta: el despliegue las lanza en un
  # paso propio y visible ANTES de cambiar la imagen (D.5-VM), con la salida en el log del
  # workflow. Una migración que corre dentro del arranque deja el sistema a medias y el
  # motivo enterrado en los logs del contenedor.
  # ---------------------------------------------------------------------------
  migrate:
    <<: *imagen
    container_name: govgenai_migrate
    profiles: ["migrate"]
    env_file:
      - /opt/govgenai/.env.runtime
    # Sin `uv run`: la imagen de runtime no lleva `uv`, tiene el venv en el PATH
    # (`/app/server/.venv/bin`) y `alembic.ini` en `/app/server`. El primer intento lo escribió
    # con `uv run` copiándolo del prompt, y habría fallado en el despliegue con «executable
    # file not found».
    working_dir: /app/server
    command: ["alembic", "upgrade", "head"]
    volumes:
      - /opt/govgenai/cloudsql:/cloudsql:ro
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
    # Issue #149 — Corre una vez al desplegar y termina. Lleva techo igual: «se ejecuta una vez»
    # no es «no puede portarse mal», y una migracion sobre una tabla grande es justamente un
    # riesgo de memoria.
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: "no"

  frontend:
    image: ${GOVGENAI_FRONTEND_IMAGE:?falta GOVGENAI_FRONTEND_IMAGE}
    container_name: govgenai_frontend
    # Issue #149 — 7 MiB medidos. Sirve ficheros estaticos.
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # El sandbox de scripts, y la capa 8 del modelo de seguridad.
  #
  # `runtime: runsc` (gVisor) va SÓLO aquí: es el único servicio que ejecuta código que no
  # hemos escrito nosotros. Hasta el 2026-08-10 esta capa la regalaba la plataforma; en una
  # VM la pone el aprovisionamiento, y `docs/SANDBOX_SECURITY.md` lleva el comando que
  # comprueba que está de verdad. Si `runsc` no estuviera instalado, este servicio no
  # arranca — y es preferible a arrancar creyendo que hay ocho capas cuando hay siete.
  # ---------------------------------------------------------------------------
  script-sandbox:
    image: ${GOVGENAI_SANDBOX_IMAGE:?falta GOVGENAI_SANDBOX_IMAGE}
    container_name: govgenai_script_sandbox
    # La única diferencia con el servicio de `docker-compose.prod.yml` es esta línea y que la
    # imagen viene de Artifact Registry en vez de construirse. Todo lo demás está copiado a
    # propósito: las capas 3, 4, 6 y 7 del modelo de seguridad están ahí, y aquí no se
    # reinventan ni se «mejoran».
    runtime: runsc
    environment:
      SANDBOX_TMP_DIR: /tmp/sandbox
    networks:
      - sandbox-net
    read_only: true
    tmpfs:
      - /tmp/sandbox:size=128M,mode=0700,uid=65534,gid=65534
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    # SEC.8.3: los límites de CPU y memoria no acotan el número de procesos, así que una
    # fork-bomb agota los PID del host sin salirse de su presupuesto de memoria.
    pids_limit: 128
    # ⚠️ **192M es un préstamo, no un dimensionamiento. Y tiene condición de salida.**
    #
    # El 2026-09-24 este techo pasó de 512M a 192M para dárselos a `app`, que se quedaba sin
    # memoria atendiendo consultas del chat y dejaba el widget colgado. En una `e2-small` el
    # presupuesto está agotado y no había otro sitio de donde sacarlos.
    #
    # **Se decidió porque hoy nadie ejecuta scripts**: el proyecto está en fase de
    # experimentación y el sandbox lleva su cuota parada, consumiendo 91 MiB en reposo. Con 192M
    # arranca y responde a su health check, que es todo lo que hace falta mientras no se use.
    #
    # **Qué se rompe cuando la condición deje de ser cierta.** Este número no es holgura: es la
    # cuota de memoria de los scripts de usuario. Un guion de informes que procese una hoja de
    # cálculo de cierto tamaño morirá por OOM con 192M, y el síntoma que verá quien lo ejecute
    # será «el script falla» sin decir por qué. Esta línea es la explicación.
    #
    # **La salida estaba decidida y se ha ejecutado el 2026-09-25**: la VM subió a `e2-medium`
    # (4 GB) —no por los scripts, sino porque la reingesta del corpus no cabía— y este techo
    # vuelve a sus 512M. El préstamo queda saldado; la issue #149 llevaba la factura hecha.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 128
        reservations:
          memory: 128M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # El MCP remoto (REG.4). Proceso pequeño y aparte, y por dos razones:
  #
  # No es la aplicación. `mcp_server/` no importa `server.app` —hay un test que lo comprueba—,
  # así que no necesita el venv del servidor ni el socket de la base. Meterlo dentro de `app`
  # le daría acceso a las dos cosas para nada.
  #
  # **No lleva PAT.** Es la decisión del prompt: cada cliente presenta el suyo en la petición.
  # Un token en el entorno de este servicio haría que todos los que se conectaran actuaran con
  # el mismo —mismos permisos, misma organización y mismo rastro en el registro de actividad—,
  # y la trazabilidad que el bloque REG existe para dar se perdería justo aquí.
  #
  # Los hosts admitidos **se derivan de los dos nombres que sirve el proxy** y no son una
  # variable propia. La protección contra DNS rebinding del SDK valida la cabecera `Host`, y
  # Caddy reenvía la original: si a esta lista le faltara un nombre, ese nombre recibiría 421
  # en todo `/mcp` sin que nada dijera por qué. Derivarla es lo que impide que se quede atrás
  # el día que cambie un nombre — que es exactamente lo que pasó con las 313 páginas del
  # corpus cuando el host vivía escrito en dos sitios. La coma sobrante cuando el
  # institucional está vacío no molesta: `load_http_config` descarta los tramos en blanco.
  # ---------------------------------------------------------------------------
  mcp:
    image: ${GOVGENAI_MCP_IMAGE:?falta GOVGENAI_MCP_IMAGE}
    container_name: govgenai_mcp
    environment:
      # Por la red interna del Compose: la llamada no sale de la máquina ni vuelve por el proxy.
      GOVGENAI_API_BASE_URL: http://app:8000
      GOVGENAI_MCP_ALLOWED_HOSTS: ${GOVGENAI_HOST:?falta GOVGENAI_HOST},${GOVGENAI_HOST_INSTITUCIONAL:-}
    depends_on:
      - app
    # Issue #149 — 71 MiB medidos.
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Caddy: TLS con renovación automática y sin ceremonia. El nombre del host llega por
  # entorno porque en el prototipo es un `sslip.io` y mañana el subdominio institucional:
  # cambiarlo tiene que ser una variable, no una edición.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: govgenai_caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      GOVGENAI_HOST: ${GOVGENAI_HOST:?falta GOVGENAI_HOST}
      # El bucket del sitio del corpus, al que el proxy manda todo lo que no es API ni panel
      # (DOM.1). **Exigido y no con defecto**: un `{$CORPUS_BUCKET}` vacío compone
      # `https://.storage.googleapis.com`, y entonces la portada, los cercadores y las 313
      # fichas fallan a la vez sin que ningún log diga por qué. Mejor no arrancar.
      CORPUS_BUCKET: ${CORPUS_BUCKET:?falta CORPUS_BUCKET}
    volumes:
      - /opt/govgenai/Caddyfile:/etc/caddy/Caddyfile:ro
      # Sitios con certificado propio (D.8). El directorio puede estar VACÍO: el `import` del
      # Caddyfile es un glob, y quien escribe aquí es `vm_fetch_tls.sh` sólo si el certificado
      # se ha podido bajar.
      - /opt/govgenai/sites.d:/etc/caddy/sites.d:ro
      # El certificado y su clave, en solo lectura. Caddy no tiene por qué poder escribirlos.
      - /opt/govgenai/tls:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - frontend
      - mcp
    # Issue #149 — 36 MiB medidos.
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 48M
    restart: unless-stopped

# Las dos redes declaran subred **a propósito**, y no es cosmética: `FORWARDED_ALLOW_IPS` se
# acota a la de `default`, y sin subredes fijas eso sería una conjetura sobre lo que Docker
# asigne. Con ellas se puede demostrar que la red del sandbox queda fuera.
#
# Rangos del pool privado que Docker usa para redes de usuario, elegidos altos para no chocar
# con las redes por defecto (`bridge` suele coger 172.17.0.0/16).
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  sandbox-net:
    # Sin salida a internet ni resolución hacia otros servicios: la capa 3 del modelo de
    # seguridad del sandbox.
    internal: true
    # Declarada y **separada de la de arriba** para que uvicorn no confíe en ella: aquí corre
    # código de usuario, y desde aquí se llega a `app:8000` porque `app` está en las dos redes.
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  caddy_data:
  caddy_config:
